<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Monster Battle RPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* 全体のスクロールを無効化し、中央に配置する */
        body { 
            margin: 0; 
            background-color: #111; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none; 
            touch-action: none; /* スマホでの誤スクロール防止 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* ゲーム画面のコンテナ（最大幅を決めて中央に寄せる） */
        #game-container { 
            width: 100%; 
            height: 100%; 
            max-width: 1024px; /* タブレットサイズを上限に */
            position: relative; 
            background-color: #000; 
            overflow: hidden; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Layers */
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .hidden { display: none !important; }
        
        /* Field UI */
        #field-hud { padding: 5%; display: flex; justify-content: space-between; align-items: flex-start; }
        .hud-panel { background: rgba(26, 32, 44, 0.85); padding: 10px 16px; border-radius: 8px; border: 2px solid #718096; box-shadow: 0 4px 6px rgba(0,0,0,0.5); pointer-events: auto; }
        
        /* Battle UI */
        #battle-ui { flex-direction: column; justify-content: flex-end; background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.8) 100%); }
        .status-panel { position: absolute; background: rgba(26, 32, 44, 0.9); padding: 10px 16px; border-radius: 8px; border: 2px solid #718096; width: 45%; max-width: 260px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        #enemy-status { top: 5%; left: 5%; }
        #player-status { bottom: 38%; right: 5%; }
        .hp-bar-bg { background-color: #4a5568; border-radius: 9999px; overflow: hidden; height: 12px; width: 100%; border: 2px solid #1a202c; }
        .hp-bar-fill { background-color: #48bb78; height: 100%; transition: width 0.3s ease; }
        .exp-bar-bg { background-color: #2d3748; height: 4px; width: 100%; margin-top: 4px; border-radius: 2px; }
        .exp-bar-fill { background-color: #4299e1; height: 100%; transition: width 0.3s ease; }
        
        #battle-bottom { height: 35%; background: #2d3748; border-top: 4px solid #4a5568; display: flex; flex-direction: column; pointer-events: auto; }
        #message-box { flex: 0 0 35%; padding: 12px 16px; font-size: 1.1rem; border-bottom: 2px solid #4a5568; overflow-y: auto; text-shadow: 1px 1px 0px #000; }
        #command-box { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; overflow-y: auto; }
        
        /* Buttons */
        .btn { background: #4a5568; border: 2px solid #718096; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; transition: all 0.1s; font-weight: bold; }
        .btn:hover { background: #718096; }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Menus */
        .menu-overlay { background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
        .menu-window { background: #2d3748; border: 4px solid #4a5568; border-radius: 12px; width: 95%; max-width: 700px; max-height: 85%; overflow-y: auto; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); touch-action: auto; /* メニュー内はスクロール許可 */ }
        
        /* Util */
        .type-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-right: 4px; color: white; text-shadow: 1px 1px 1px rgba(0,0,0,0.5); }
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }
        
        /* Joystick/Controls for Mobile/Desktop */
        #controls { position: absolute; bottom: 5%; left: 5%; pointer-events: auto; display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px; gap: 5px; opacity: 0.8; }
        .ctrl-btn { background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; font-size: 24px; display: flex; justify-content: center; align-items: center; font-weight: bold; user-select: none; }
        .ctrl-btn:active { background: rgba(255,255,255,0.6); }

        .hint-text { position: absolute; bottom: 5%; right: 5%; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; font-size: 0.9rem; pointer-events: auto; }

        /* Save indicator */
        #save-indicator { position: absolute; top: 5%; left: 50%; transform: translateX(-50%); background: rgba(72, 187, 120, 0.9); padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; pointer-events: none; opacity: 0; transition: opacity 0.5s; z-index: 100; box-shadow: 0 0 10px rgba(72,187,120,0.5); }
    </style>
</head>

        </div>
    </div>

    <div id="menu-overlay" class="layer hidden menu-overlay">

// ==========================================
class PokemonInst {
    constructor(baseId, level) {
        this.data = MONSTERS[baseId];
        this.baseId = baseId;
        this.level = level;
        this.exp = Math.pow(level, 3);
        this.calcStats();
        this.hp = this.maxHp;
        this.skills = this.data.k.map(id => SKILLS.find(s => s.id === id));
        this.mesh = null;
    }
    calcStats() {
        const d = this.data.s;
        const lv = this.level;
        this.maxHp = Math.floor((d[0] * 2 + 31 + 85) * lv / 100) + lv + 10;
        this.atk = Math.floor((d[1] * 2 + 31 + 85) * lv / 100) + 5;
        this.def = Math.floor((d[2] * 2 + 31 + 85) * lv / 100) + 5;
        this.spa = Math.floor((d[3] * 2 + 31 + 85) * lv / 100) + 5;
        this.spd = Math.floor((d[4] * 2 + 31 + 85) * lv / 100) + 5;
        this.spe = Math.floor((d[5] * 2 + 31 + 85) * lv / 100) + 5;
        this.maxExp = Math.pow(this.level + 1, 3);
    }
    addExp(val) {
        let msgs = [`${this.data.n} は ${val} EXP もらった！`];
        this.exp += val;
        while(this.exp >= this.maxExp && this.level < 100) {
            this.level++;
            this.calcStats();
            msgs.push(`${this.data.n} は Lv.${this.level} にあがった！`);
        }
        return msgs;
    }
}

window.addEventListener('DOMContentLoaded', () => {
    if(localStorage.getItem('3d_monster_rpg_save')) {
        $('btn-continue').classList.remove('hidden');
    }
});

function saveGame() {
    const saveData = {
        money: state.money,
        items: state.items,
        pokedex: state.pokedex,
        pos: state.pos,
        area: state.area,
        bossDefeated: state.bossDefeated,
        party: state.party.map(p => ({ baseId: p.baseId, level: p.level, exp: p.exp, hp: p.hp })),
        box: state.box.map(p => ({ baseId: p.baseId, level: p.level, exp: p.exp, hp: p.hp }))
    };
    localStorage.setItem('3d_monster_rpg_save', JSON.stringify(saveData));
    
    // Show indicator
    const ind = $('save-indicator');
    ind.style.opacity = '1';
    setTimeout(() => { ind.style.opacity = '0'; }, 2000);
}

function loadGame() {
    try {
        const data = localStorage.getItem('3d_monster_rpg_save');
        if(!data) return false;
        const d = JSON.parse(data);
        state.money = d.money || 0;
        state.items = d.items || [5, 0, 0, 0, 0, 0, 0, 0, 0, 0];
        state.pokedex = d.pokedex || {};
        state.pos = d.pos || {x: -60, z: -60};
        state.area = d.area || 0;
        state.bossDefeated = d.bossDefeated || false;
        
        const restoreMon = (p) => {
            let mon = new PokemonInst(p.baseId, p.level);
            mon.exp = p.exp;
            mon.calcStats();
            mon.hp = p.hp; // HP restored after maxHp calculation
            return mon;
        };
        
        state.party = (d.party || []).map(restoreMon);
        state.box = (d.box || []).map(restoreMon);
        return true;
    } catch(e) {
        console.error("Save data parsing error:", e);
        return false;
    }
}

let sceneF, sceneB, camera, renderer;

function init3D() {

    sceneF = new THREE.Scene();

    const dlF = new THREE.DirectionalLight(0xffffff, 0.8);

function createMonMesh(v) {
    const grp = new THREE.Group();
    const mat = new THREE.MeshPhongMaterial({color: v.c, shininess:30});
    let geo;
    switch(v.g) {
        case 0: geo = new THREE.BoxGeometry(1.5,1.5,1.5); break;
        case 1: geo = new THREE.SphereGeometry(1,32,32); break;
        case 2: geo = new THREE.ConeGeometry(1,2,32); break;
        case 3: geo = new THREE.TorusGeometry(0.8,0.3,16,50); break;
        case 4: geo = new THREE.CylinderGeometry(0.8,0.8,2,32); break;
        case 5: geo = new THREE.IcosahedronGeometry(1,0); break;
        default: geo = new THREE.BoxGeometry(1,1,1);
    }
    const b = new THREE.Mesh(geo, mat);
    b.scale.set(...v.scl);
    const box = new THREE.Box3().setFromObject(b);
    b.position.y = (box.max.y - box.min.y) / 2;
    grp.add(b);
    
    // Parts
    const pGeo = new THREE.ConeGeometry(0.3, 0.8, 16);
    const pMat = new THREE.MeshPhongMaterial({color: 0xffffff});
    for(let i=0; i<v.p; i++) {
        const p = new THREE.Mesh(pGeo, pMat);
        const ang = (i/v.p)*Math.PI*2;
        p.position.set(Math.cos(ang)*0.8, b.position.y+0.5, Math.sin(ang)*0.8);
        p.rotation.set(Math.random(),0,Math.random());
        p.scale.setScalar(0.5+Math.random()*0.5);
        grp.add(p);
    }
    return grp;
}

// ==========================================
// MAIN LOOP & FIELD LOGIC
// ==========================================
function animateLoop() {
    requestAnimationFrame(animateLoop);
    
    if(state.mode === 'FIELD') {
        let moved = false;
        let dx = 0, dz = 0;
        const spd = 0.5;
        if(k.w) dz = -spd; if(k.s) dz = spd;
        if(k.a) dx = -spd; if(k.d) dx = spd;
        
        if(dx !== 0 || dz !== 0) {
            state.pos.x = Math.max(-95, Math.min(95, state.pos.x + dx));
            state.pos.z = Math.max(-95, Math.min(95, state.pos.z + dz));
            moved = true;
        }

        playerMesh.position.set(state.pos.x, 1, state.pos.z);
        
        // Camera Follow
        camera.position.lerp(new THREE.Vector3(state.pos.x, 15, state.pos.z + 20), 0.1);
        camera.lookAt(state.pos.x, 0, state.pos.z);

        // Area Check
        let distToCenter = Math.sqrt(state.pos.x**2 + state.pos.z**2);
        let newArea = 0;
        if(distToCenter < 15) newArea = 4; // Boss
        else if(state.pos.x < 0 && state.pos.z < 0) newArea = 0;
        else if(state.pos.x > 0 && state.pos.z < 0) newArea = 1;
        else if(state.pos.x > 0 && state.pos.z > 0) newArea = 2;
        else newArea = 3;

        if(state.area !== newArea) {
            state.area = newArea;
            $('area-display').innerText = `エリア: ${AREAS[state.area].n}`;
        }
        
        // Pokemon Center Check
        const distToPC = Math.hypot(-60 - state.pos.x, -60 - state.pos.z);
        if (distToPC < 6) {
            if (!state.inPokeCenter) {
                state.inPokeCenter = true;
                healAllPokemon();
            }
        } else {
            state.inPokeCenter = false;
        }
        
        // Boss Hide/Show based on state
        bossMesh.visible = !state.bossDefeated;

        // Encounters & Triggers
        if(moved) {
            // Random Encounter
            if(newArea < 4 && Math.random() < 0.005) { // 0.5% per frame while moving
                startWildBattle();
            }
            // Boss Encounter
            if(newArea === 4 && !state.bossDefeated && distToCenter < 5) {
                startBossBattle();
            }
            // Trainer Check
            TRAINERS.forEach(t => {
                if(!t.d && Math.hypot(t.x - state.pos.x, t.z - state.pos.z) < 4) {
                    startTrainerBattle(t);
                }
            });
        }
        
        renderer.render(sceneF, camera);
        
    } else if(state.mode === 'BATTLE') {
        // Simple idle anim
        if(state.b.pMesh) state.b.pMesh.position.y = Math.sin(Date.now()*0.005)*0.1;
        if(state.b.eMesh) state.b.eMesh.position.y = Math.sin(Date.now()*0.005+3)*0.1;
        renderer.render(sceneB, camera);
    }
}

function healAllPokemon() {
    let needsHeal = false;
    state.party.forEach(p => { if(p.hp < p.maxHp) needsHeal = true; });
    
    if(!needsHeal && state.party.findIndex(p => p.hp <= 0) === -1) {
        showFieldMessage("ポケモンセンターへ ようこそ！<br>手持ちのポケモンは 元気いっぱいです！");
        return;
    }
    
    state.party.forEach(p => { p.hp = p.maxHp; });
    state.box.forEach(p => { p.hp = p.maxHp; });
    
    showFieldMessage("ティロリロリン♪<br>手持ちのポケモンが 全回復した！");
    saveGame();
}

function showFieldMessage(msg) {
    const el = $('field-msg');
    el.innerHTML = msg;
    el.classList.remove('hidden');
    setTimeout(() => { el.classList.add('hidden'); }, 3000);
}

function startGame(isContinue) {
    $('start-overlay').classList.add('hidden');
    init3D();
    
    if(isContinue && loadGame()) {
        // Loaded successfully
    } else {
        // New Game: Give initial Pikachu LV 20!
        state.party = [new PokemonInst(3, 20)];
        state.pokedex[3] = 2;
        saveGame();
    }
    
    setMode('FIELD');
}

function setMode(mode) {
    state.mode = mode;
    $('field-ui').classList.toggle('hidden', mode !== 'FIELD');
    $('battle-ui').classList.toggle('hidden', mode !== 'BATTLE');
    $('menu-overlay').classList.add('hidden'); // Ensure closed
    
    if(mode === 'FIELD') {
        $('money-display').innerText = state.money;

        k.w = k.a = k.s = k.d = false;
    } else if(mode === 'BATTLE') {

        camera.lookAt(0, 2, 0);
    }
}

        openMenu('SHOP'); // refresh

function withdrawBox(idx) {

        openMenu('PARTY');

}

function depositBox(idx) {

        openMenu('PARTY');

        alert("手持ちが いなくなってしまう！");

// ==========================================
function clearBattleScene() {
    if(state.b.pMesh) sceneB.remove(state.b.pMesh);
    if(state.b.eMesh) sceneB.remove(state.b.eMesh);
    state.b.pMesh = null; state.b.eMesh = null;
}

function setupBattleScene() {
    clearBattleScene();
    const p = state.party[state.b.pIdx];
    const e = state.b.enemyParty[state.b.eIdx];
    
    // Add Dex
    if(!state.pokedex[e.baseId]) state.pokedex[e.baseId] = 1;
    
    state.b.pMesh = createMonMesh(p.data.v);
    state.b.pMesh.position.set(-3, 0, 4);
    state.b.pMesh.rotation.y = Math.PI - 0.5;
    sceneB.add(state.b.pMesh);
    
    state.b.eMesh = createMonMesh(e.data.v);
    state.b.eMesh.position.set(3, 0, -4);
    state.b.eMesh.rotation.y = -0.5;
    sceneB.add(state.b.eMesh);
    
    updateBattleUI();
}

function updateBattleUI() {
    const p = state.party[state.b.pIdx];
    const e = state.b.enemyParty[state.b.eIdx];
    
    $('player-name').innerText = p.data.n;
    $('player-lv').innerText = `Lv.${p.level}`;
    $('player-hp-text').innerText = `${Math.max(0, p.hp)} / ${p.maxHp}`;
    $('player-hp-bar').style.width = `${Math.max(0, p.hp/p.maxHp*100)}%`;
    $('player-hp-bar').style.backgroundColor = (p.hp/p.maxHp) > 0.5 ? '#48bb78' : (p.hp/p.maxHp) > 0.2 ? '#ecc94b' : '#f56565';
    $('player-exp-bar').style.width = `${((p.exp - Math.pow(p.level,3)) / (p.maxExp - Math.pow(p.level,3)))*100}%`;
    $('player-types').innerHTML = `<span class="type-badge" style="background:${T_COL[p.data.t1]}">${TYPES[p.data.t1]}</span>` + (p.data.t2 !== -1 ? `<span class="type-badge" style="background:${T_COL[p.data.t2]}">${TYPES[p.data.t2]}</span>` : '');

    $('enemy-name').innerText = e.data.n;
    $('enemy-lv').innerText = `Lv.${e.level}`;
    $('enemy-hp-bar').style.width = `${Math.max(0, e.hp/e.maxHp*100)}%`;
    $('enemy-hp-bar').style.backgroundColor = (e.hp/e.maxHp) > 0.5 ? '#48bb78' : (e.hp/e.maxHp) > 0.2 ? '#ecc94b' : '#f56565';
    $('enemy-types').innerHTML = `<span class="type-badge" style="background:${T_COL[e.data.t1]}">${TYPES[e.data.t1]}</span>` + (e.data.t2 !== -1 ? `<span class="type-badge" style="background:${T_COL[e.data.t2]}">${TYPES[e.data.t2]}</span>` : '');
}

async function logMsg(msg, delay=1000) {
    const box = $('message-box');
    box.innerHTML = `<div>${msg}</div>`;
    if(delay>0) await new Promise(r => setTimeout(r, delay));
}

// -- Encounter Generators --
function getAvailableIdx() {
    let alive = state.party.findIndex(p => p.hp > 0);
    if(alive === -1) {
        // Heal all if wiped out
        state.party.forEach(p => p.hp = p.maxHp);
        alive = 0;
    }
    return alive;
}

async function startWildBattle() {
    const a = AREAS[state.area];
    // Filter monsters by area
    const pool = MONSTERS.filter(m => m.a.includes(state.area));
    if(pool.length === 0) return;
    
    const mData = pool[Math.floor(Math.random() * pool.length)];
    const lv = Math.floor(Math.random()*(a.lvMax - a.lvMin + 1)) + a.lvMin;
    
    state.b = { type: 'WILD', enemyParty: [new PokemonInst(mData.id, lv)], pIdx: getAvailableIdx(), eIdx: 0, turn: 1, trainer: null, canCatch: true };
    setMode('BATTLE');
    setupBattleScene();
    await logMsg(`やせいの ${state.b.enemyParty[0].data.n} が あらわれた！`, 1500);
    showBattleCommands();
}

async function startBossBattle() {
    state.b = { type: 'BOSS', enemyParty: [new PokemonInst(11, 70)], pIdx: getAvailableIdx(), eIdx: 0, turn: 1, trainer: null, canCatch: true };
    setMode('BATTLE');
    setupBattleScene();
    await logMsg(`ミュウツー「ミュウッ！！」`, 2000);
    showBattleCommands();
}

async function startTrainerBattle(trainer) {
    trainer.d = true; // Set defeated flag optimistically
    const eParty = trainer.p.map(pd => new PokemonInst(pd.id, pd.lv));
    state.b = { type: 'TRAINER', enemyParty: eParty, pIdx: getAvailableIdx(), eIdx: 0, turn: 1, trainer: trainer, canCatch: false };
    setMode('BATTLE');
    setupBattleScene();
    await logMsg(`${trainer.n} が しょうぶを しかけてきた！`, 1500);
    showBattleCommands();
}

function showBattleCommands() {
    $('command-box').innerHTML = `
        <button class="btn bg-red-800 hover:bg-red-700 text-white text-base md:text-xl" onclick="showSkills()">たたかう</button>
        <button class="btn bg-green-800 hover:bg-green-700 text-white text-base md:text-xl" onclick="openMenu('PARTY')">ポケモン</button>

    const p = state.party[state.b.pIdx];

        html += `<button class="btn text-white" style="border-color:${T_COL[s.t]}; border-width:3px;" onclick="executeTurn(${s.id})">

// -- Battle Logic --
async function switchPokemon(newIdx) {
    closeMenu();
    $('command-box').innerHTML = '';
    await logMsg(`${state.party[state.b.pIdx].data.n} もどれ！`, 1000);
    state.b.pIdx = newIdx;
    setupBattleScene();
    await logMsg(`いけっ！ ${state.party[state.b.pIdx].data.n}！`, 1000);
    
    // Enemy gets free hit
    await executeEnemyTurn();
    state.b.turn++;
    if(state.mode === 'BATTLE') showBattleCommands();
}

async function useBall(ballId) {
    if(!state.b.canCatch) {
        alert("ひとの ものを とったら どろぼう！"); return;
    }
    closeMenu();
    $('command-box').innerHTML = '';
    state.items[ballId]--;
    const bData = BALLS[ballId];
    const e = state.b.enemyParty[state.b.eIdx];
    const p = state.party[state.b.pIdx];
    
    await logMsg(`${bData.n} を なげた！`, 1500);
    
    // Simple Catch Logic
    let rate = ((e.maxHp - e.hp) / e.maxHp) * 0.3; // max 30% base
    let mult = 1.0;
    if(ballId===1) mult = 1.5;
    if(ballId===2) mult = 2.0;
    if(ballId===3) mult = 1000;
    if(ballId===4 && state.b.turn===1) mult = 5.0;
    if(ballId===5) mult = Math.min(4.0, 1.0 + state.b.turn*0.3);
    if(ballId===6 && e.level > p.level) mult = 3.0;
    if(ballId===7 && e.level < p.level) mult = 3.0;
    if(ballId===8 && (state.area===3 || e.data.t1===2 || e.data.t1===5)) mult = 3.5;
    if(ballId===9 && (e.data.t1===11 || e.data.t1===2)) mult = 3.5;
    
    let caught = Math.random() < (rate * mult + 0.1); // Add base 10%
    if(ballId===3) caught = true;

    // Anim (Spin Enemy)
    const int = setInterval(()=>state.b.eMesh.rotation.y += 0.5, 50);
    await new Promise(r => setTimeout(r, 1500));
    clearInterval(int);

    if(caught) {
        state.b.eMesh.scale.set(0,0,0);
        await logMsg(`やったー！ ${e.data.n} を つかまえた！`, 2000);
        state.pokedex[e.baseId] = 2;
        
        // Heal captured mon to full
        e.hp = e.maxHp;
        if(state.party.length < 6) {
            state.party.push(e);
            await logMsg(`手持ち に くわわった！`, 1500);
        } else {
            state.box.push(e);
            await logMsg(`ボックス に おくられた！`, 1500);
        }
        
        if(state.b.type === 'BOSS') state.bossDefeated = true;
        endBattleScene();
    } else {
        await logMsg(`ああっと！ つかまらない！`, 1500);
        await executeEnemyTurn();
        state.b.turn++;
        if(state.mode === 'BATTLE') showBattleCommands();
    }
}

async function tryFlee() {
    $('command-box').innerHTML = '';
    if(state.b.type === 'TRAINER' || state.b.type === 'BOSS') {
        await logMsg(`ダメだ！ にげられない！`, 1500);
        await executeEnemyTurn();
        state.b.turn++;
        if(state.mode === 'BATTLE') showBattleCommands();
    } else {
        await logMsg(`うまく にげきれた！`, 1500);
        endBattleScene();
    }
}

async function executeTurn(skillId) {
    $('command-box').innerHTML = '';
    const pSkill = SKILLS.find(s=>s.id===skillId);
    const p = state.party[state.b.pIdx];
    const e = state.b.enemyParty[state.b.eIdx];
    const eSkill = e.skills[Math.floor(Math.random()*e.skills.length)];
    
    // Speed check
    let first = p, second = e, fSkill = pSkill, sSkill = eSkill, isPFirst = true;
    if(e.spe > p.spe || (e.spe===p.spe && Math.random()>0.5)) {
        first = e; second = p; fSkill = eSkill; sSkill = pSkill; isPFirst = false;
    }

    await doAttack(first, second, fSkill, isPFirst);
    if(second.hp <= 0) return handleFaint(second, !isPFirst);
    
    await doAttack(second, first, sSkill, !isPFirst);
    if(first.hp <= 0) return handleFaint(first, isPFirst);
    
    state.b.turn++;
    showBattleCommands();
}

async function doAttack(atk, def, skill, isPlayerAtk) {
    await logMsg(`${atk.data.n} の ${skill.n}！`, 1000);
    
    if(Math.random()*100 > skill.a) {
        await logMsg(`しかし こうげきは はずれた！`, 1000);
        return;
    }
    
    // Anim
    const meshA = isPlayerAtk ? state.b.pMesh : state.b.eMesh;
    const meshD = isPlayerAtk ? state.b.eMesh : state.b.pMesh;
    const sPos = meshA.position.clone();
    
    // Dash
    meshA.position.lerp(meshD.position, 0.3);
    await new Promise(r=>setTimeout(r, 200));
    
    // Hit
    meshD.children.forEach(c => { if(c.material) { c.userData.oc = c.material.color.getHex(); c.material.color.setHex(0xff0000); }});
    const uiId = isPlayerAtk ? 'enemy-status' : 'player-status';
    $(uiId).classList.remove('shake'); void $(uiId).offsetWidth; $(uiId).classList.add('shake');
    await new Promise(r=>setTimeout(r, 200));
    
    // Return
    meshD.children.forEach(c => { if(c.material && c.userData.oc) c.material.color.setHex(c.userData.oc); });
    meshA.position.copy(sPos);

    // Damage Calc
    let aStat = skill.c===0 ? atk.atk : atk.spa;
    let dStat = skill.c===0 ? def.def : def.spd;
    let base = Math.floor(Math.floor(Math.floor(22*skill.p*aStat/dStat)/50)+2);
    let crit = Math.random() < 0.0625; if(crit) base = Math.floor(base*1.5);
    let stab = (skill.t===atk.data.t1 || skill.t===atk.data.t2) ? 1.5 : 1.0;
    let eff1 = getTypeEff(skill.t, def.data.t1);
    let eff2 = def.data.t2!==-1 ? getTypeEff(skill.t, def.data.t2) : 1.0;
    let eff = eff1 * eff2;
    
    if(eff===0) { await logMsg(`こうかがない みたいだ...`, 1500); return; }
    
    let dmg = Math.max(1, Math.floor(base * (0.85+Math.random()*0.15) * stab * eff));
    def.hp -= dmg;
    updateBattleUI();
    
    if(eff>1) await logMsg(`こうかは ばつぐんだ！`, 1000);
    if(eff<1) await logMsg(`こうかは いまひとつの ようだ...`, 1000);
    if(crit) await logMsg(`きゅうしょに あたった！`, 1000);
}

function getTypeEff(a, d) {
    const v = T_CHART[a][d];
    return v===0 ? 0 : v===1 ? 0.5 : v===2 ? 1.0 : 2.0;
}

async function executeEnemyTurn() {
    const e = state.b.enemyParty[state.b.eIdx];
    const p = state.party[state.b.pIdx];
    const s = e.skills[Math.floor(Math.random()*e.skills.length)];
    await doAttack(e, p, s, false);
    if(p.hp <= 0) await handleFaint(p, true);
}

async function handleFaint(mon, isPlayerMon) {
    await logMsg(`${mon.data.n} は たおれた！`, 1500);
    
    // Anim
    const mesh = isPlayerMon ? state.b.pMesh : state.b.eMesh;
    const int = setInterval(()=>{ mesh.position.y -= 0.2; mesh.rotation.x -= 0.1; }, 30);
    await new Promise(r=>setTimeout(r, 1000));
    clearInterval(int);
    sceneB.remove(mesh);
    
    if(!isPlayerMon) {
        // Gain Exp
        const exp = state.b.enemyParty[state.b.eIdx].level * 10;
        const msgs = state.party[state.b.pIdx].addExp(exp);
        updateBattleUI();
        for(let m of msgs) await logMsg(m, 1200);
        
        // Next Enemy or Win
        state.b.eIdx++;
        if(state.b.eIdx < state.b.enemyParty.length) {
            await logMsg(`あいては ${state.b.enemyParty[state.b.eIdx].data.n} を だした！`, 1500);
            setupBattleScene();
            state.b.turn++;
            showBattleCommands();
        } else {
            await logMsg(`しょうぶに かった！`, 1500);
            let mon = 500;
            if(state.b.type === 'TRAINER') mon = 2000;
            if(state.b.type === 'BOSS') { mon = 10000; state.bossDefeated = true; await logMsg("ミュウツーを たおした！", 1500); }
            state.money += mon;
            await logMsg(`${mon}円 手に入れた！`, 1500);
            endBattleScene();
        }
    } else {
        // Next Player Mon or Lose
        const next = state.party.findIndex(p => p.hp > 0);
        if(next !== -1) {
            openMenu('PARTY'); // Force switch
            $('message-box').innerHTML = '<div>次に出すポケモンを選んでください。</div>';
        } else {
            await logMsg(`めのまえが まっくらになった...`, 2000);
            // 手持ちの全滅時はポケモンセンターに戻されたと仮定して、少し座標を戻して全回復する
            state.party.forEach(p => p.hp = p.maxHp);
            state.pos.x = -60;
            state.pos.z = -50;
            endBattleScene();
        }
    }
}

function endBattleScene() {
    clearBattleScene();
    saveGame(); // バトル終了時にオートセーブ
    setMode('FIELD');
}

</script>
