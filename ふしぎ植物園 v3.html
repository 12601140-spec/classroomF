<meta charset="utf-8">

<title>ふしぎ植物園 〜植えて、放置して、集めよう〜</title>
<!-- ホーム画面に追加するとブラウザUIなしの全画面で起動（PWA） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ふしぎ植物園">
<meta name="theme-color" content="#0e2418">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg1:#1a3a2a; --bg2:#0e2418;
    --ink:#23321f;
    --green:#3fa34d; --green-d:#2c7a38;
    --gold:#f5b301; --accent:#ff8a3d;
    --muted:#7a8a72;
    --soil1:#8a5a33; --soil2:#6e4525; --soil3:#503018;
    --cream:#fff7e8; --cream2:#e6cfa6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  html{background:var(--bg2);}
  body{
    font-family:"Hiragino Maru Gothic ProN","BIZ UDGothic","Yu Gothic UI",system-ui,sans-serif;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    height:100vh; height:100dvh; overflow:hidden; color:var(--ink);
    display:flex; justify-content:center;
  }
  #app{width:100%; max-width:480px; height:100vh; height:100dvh; display:flex; flex-direction:column; position:relative;}
 
  header{
    position:sticky; top:0; z-index:10;
    background:#13301f;
    color:#fff;
    /* PWA全画面起動時はOSステータスバー（時計・バッテリー）の高さぶん下げる。通常ブラウザでは0 */
    padding:calc(2px + env(safe-area-inset-top)) 14px 6px;
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  .title{font-size:15px; font-weight:bold; letter-spacing:1px; display:flex; justify-content:space-between; align-items:center;}
  .hright{display:flex; gap:6px; align-items:center;}
  .coins{background:rgba(255,255,255,.12); border-radius:999px; padding:3px 12px; font-size:15px; font-weight:bold; color:var(--gold);}
  #basket{color:#cfe8c2; cursor:pointer;}
  /* 天気テキストははたけ画面の上部にオーバーレイ */
  .weather{position:absolute; top:calc(env(safe-area-inset-top) + 44px); left:10px; right:10px; z-index:9;
    font-size:12.5px; background:rgba(18,40,28,.45); border-radius:999px; padding:4px 12px;
    display:flex; justify-content:space-between; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6); pointer-events:none;}
  .weather.rain{background:rgba(40,70,120,.5);}
  .weather.rainbow{background:linear-gradient(90deg,rgba(200,60,60,.5),rgba(200,150,40,.5),rgba(50,150,90,.5),rgba(60,100,200,.5));}
 
  main{
    flex:1; min-height:0; padding:10px 10px 14px;
    display:flex; flex-direction:column;
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain;
  }
  main>*{flex-shrink:0;}
  main .scene{flex:1 0 auto; display:flex; flex-direction:column;}
  main .scene .sky{flex-shrink:0;}
  main .scene .field{flex:1 0 auto;}
 
  .hint{
    background:#fff8dc; border:2px dashed var(--gold); border-radius:12px;
    padding:9px 12px; font-size:12.5px; margin-top:30px; margin-bottom:8px; color:#6b5200;
  }
 
  /* ===== 風景シーン ===== */
  .scene{border-radius:18px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.35);}
  .sky{height:100px; position:relative; overflow:hidden; background:linear-gradient(#6cc1f5,#bfe6ff); transition:filter 1s;}
  /* BGM消音ボタン：畑画面の空の左上（天気表示の下あたり） */
  .mutebtn{position:absolute; top:28px; left:6px; z-index:10; width:30px; height:30px; padding:0; border:none;
    border-radius:50%; background:rgba(0,0,0,.28); color:#fff; font-size:15px; line-height:30px; text-align:center;
    cursor:pointer; opacity:.87; -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .mutebtn:active{transform:scale(.9);}
  /* カカシ所持中、はたけの柵の手前（地面）に立てる。yard下端を地面ラインとして設置 */
  /* z-index:2＝ねこ/うさぎ等(3)の後ろ・ふくろう/ドラゴン(0)の前 */
  .hcscare{position:absolute; right:88px; bottom:0; z-index:2; width:auto; height:66px; cursor:pointer;
    filter:brightness(1.12) saturate(.82) drop-shadow(0 2px 2px rgba(0,0,0,.28));}
  .hcscare:active{transform:scale(.94);}
  .t-dawn .sky{background:linear-gradient(#e88a6a,#ffd9a3);}
  .t-dusk .sky{background:linear-gradient(#7c5bb5,#ff9a62);}
  .t-night .sky{background:linear-gradient(#0c1535,#2a3a66);}
  .w-rain .sky{filter:brightness(.6) saturate(.75);}
  .w-snow .sky{filter:brightness(.92) saturate(.7);}
  .w-cloud .sky{filter:brightness(.95);}
  .w-cloud .sky::before{content:""; position:absolute; inset:0; background:#8a909c; opacity:.25; pointer-events:none; z-index:1;}
  #sunmoon{position:absolute; right:20px; top:12px; font-size:40px; animation:breathe 4s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1)} 50%{transform:scale(1.08)}}
  /* 雲は left ではなく transform を動かす（GPU合成・毎フレームの再レイアウト/再描画を避ける） */
  .sky .cloud{position:absolute; left:0; animation:drift linear infinite; opacity:.92; will-change:transform;}
  .sky .c1, .sky .c2{opacity:.87;} /* はれの雲c1/c2は不透明度87%（.sky .cloudの.92を上書き） */
  .c1{top:16px; font-size:32px; animation-duration:52s;}
  .c2{top:56px; font-size:22px; animation-duration:74s; animation-delay:-36s;}
  @keyframes drift{from{transform:translateX(-60px);} to{transform:translateX(540px);}}
  /* くもり：雲を追加で増やし、面積比16倍（縦横4倍）に拡大（巨大化版キーフレーム） */
  @keyframes driftbig{from{transform:translateX(-90px) scale(6,4);} to{transform:translateX(330px) scale(6,4);}}
  .sky .cloudextra{display:none;}
  /* カラス：遠くの空を1回だけ横切るシルエット（帰還時の被害演出。3秒で自動削除） */
  .crowfly{position:absolute; top:26px; left:-38px; width:39px; height:26px; z-index:3; pointer-events:none; animation:crowx 10s linear forwards;}
  @keyframes crowx{0%{transform:translate(0,0);} 50%{transform:translate(270px,9px);} 100%{transform:translate(560px,-4px);}}
  .crowfly .cwing{transform-box:fill-box; transform-origin:85% 90%; animation:crowflap .32s ease-in-out infinite alternate;}
  @keyframes crowflap{from{transform:rotate(16deg);} to{transform:rotate(-34deg);}}
  .w-cloud .sky .cloudextra{display:block;}
  /* 動く雲(cloudextra)は driftbig キーフレームで拡大＋移動。静止雲(c1/c2)用に静的scaleも併記 */
  .w-cloud .sky .cloud{transform:scale(6,4); animation-name:driftbig;}
  /* 静止雲は左に固まりがちなので、別々の静止位置を与えて離す（アニメは増やさず負荷そのまま） */
  .w-cloud .sky .c1{transform:translateX(20px) scale(6,4);}
  .w-cloud .sky .c2{transform:translateX(185px) scale(6,4);}
  .star{position:absolute; color:#fff; font-size:11px; display:none; animation:twink 1.4s ease-in-out infinite alternate;}
  .t-night .star{display:block;}
  #skyrb{display:none; position:absolute; left:6%; bottom:-10px; font-size:72px; pointer-events:none;}
  .w-rainbow #skyrb{display:block; animation:popk .6s;}
  .w-rainbow .sky::after{content:"✨"; position:absolute; right:84px; top:46px; animation:twink 1s ease-in-out infinite alternate;}
 
  .field{
    position:relative;
    background:
      radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.4px),
      linear-gradient(180deg,#7cc257,#58a945 32%,#4c9a3e);
    background-size:18px 18px,100% 100%;
    padding:0 10px 16px;
  }
  .fence{
    height:22px; margin:0 -10px 4px;
    background:
      repeating-linear-gradient(90deg,#b97f49 0 8px, transparent 8px 40px),
      linear-gradient(180deg, transparent 4px, #9a6336 4px 9px, transparent 9px 13px, #9a6336 13px 18px, transparent 18px);
  }
  .yard{position:relative; height:46px; margin-bottom:6px;}
  .deco{position:absolute; bottom:0;}
  /* ===== ペット（行動AI＋影＋吹き出し） ===== */
  .pet{position:absolute; bottom:0; width:36px; text-align:center; z-index:3; cursor:pointer; line-height:0;}
  .pet .pbody{display:inline-block; font-size:30px; line-height:1; transform-origin:bottom center; transform:scaleX(var(--fx,1)); filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); position:relative; z-index:2;}
  .pet .pshadow{position:absolute; left:50%; bottom:-1px; transform:translateX(-50%); width:24px; height:7px; background:rgba(0,0,0,.28); border-radius:50%; z-index:1;}
  .pet .pemote{
    position:absolute; bottom:100%; left:50%; margin-bottom:7px;
    font-size:14px; line-height:1; background:#fff; color:#333; border-radius:12px;
    padding:5px 8px; box-shadow:0 2px 5px rgba(0,0,0,.28); opacity:0;
    transform:translate(-50%,4px); transition:opacity .25s, transform .25s;
    pointer-events:none; z-index:3; white-space:nowrap;
  }
  .pet .pemote::after{
    content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:5px solid transparent; border-top-color:#fff;
  }
  .pet.emoting .pemote{opacity:.87; transform:translate(-50%,0);}
  .pet.flip{--fx:-1;}
  .pet.walking .pbody{animation:gait .5s ease-in-out infinite;}
  .pet-rabbit.walking .pbody{animation:hopk .55s ease-in-out infinite;}
  .pet-rabbit.walking .pshadow{animation:shp .55s ease-in-out infinite;}
  .pet-dragon .pbody{animation:hoverk 2.2s ease-in-out infinite;}
  .pet-dragon{bottom:10px; z-index:0;}
  .pet-dragon .pshadow{width:16px; background:rgba(0,0,0,.18);}
  .pet-owl{bottom:40px; z-index:0;}
  .pet-owl .pshadow{display:none;}
  .pet.sitting .pbody{transform:scaleX(var(--fx,1)) scaleY(.92);}
  .pet.sleeping .pbody{animation:breathe2 3s ease-in-out infinite;}
  .pet.joy .pbody{animation:petjump .6s ease-out;}
  @keyframes gait{0%,100%{transform:scaleX(var(--fx,1)) scaleY(1) translateY(0);}50%{transform:scaleX(var(--fx,1)) scaleY(.9) translateY(-2px);}}
  @keyframes hopk{0%,100%{transform:scaleX(var(--fx,1)) translateY(0) scaleY(.94);}40%{transform:scaleX(var(--fx,1)) translateY(-12px) scaleY(1.06);}}
  @keyframes shp{0%,100%{transform:translateX(-50%) scale(1);}40%{transform:translateX(-50%) scale(.55);}}
  @keyframes hoverk{0%,100%{transform:scaleX(var(--fx,1)) translateY(0);}50%{transform:scaleX(var(--fx,1)) translateY(-6px);}}
  @keyframes breathe2{0%,100%{transform:scaleX(var(--fx,1)) scaleY(1);}50%{transform:scaleX(var(--fx,1)) scaleY(.95);}}
  @keyframes petjump{0%{transform:scaleX(var(--fx,1)) translateY(0) scaleY(1);}30%{transform:scaleX(var(--fx,1)) translateY(-14px) scaleY(1.08);}60%{transform:scaleX(var(--fx,1)) translateY(0) scaleY(.85);}100%{transform:scaleX(var(--fx,1)) scaleY(1);}}
 
  /* ===== SVGペットのパーツアニメ ===== */
  .pet .pbody svg{display:block; overflow:visible; margin:0 auto;}
  .pet-cat .pbody svg,.pet-blackcat .pbody svg,.pet-dog .pbody svg{width:46px; height:37px;}
  .pet-rabbit .pbody svg{width:36px; height:39px;}
  .pet-owl .pbody svg{width:31px; height:36px;}
  .pet-dragon .pbody svg{width:50px; height:35px;}
  .psvg .tail{transform-box:fill-box; transform-origin:100% 30%; animation:tailwag 2.2s ease-in-out infinite;}
  .psvg .tailtip{transform-box:fill-box; transform-origin:100% 30%; animation:tailwag 2.2s ease-in-out infinite;}
  @keyframes tailwag{0%,100%{transform:rotate(-7deg);}50%{transform:rotate(9deg);}}
  .psvg .eye{transform-box:fill-box; transform-origin:center; animation:blinkk 4.6s infinite;}
  @keyframes blinkk{0%,91%,96%,100%{transform:scaleY(1);}93.5%{transform:scaleY(.08);}}
  .pet.sleeping .psvg .eye{animation:none; transform:scaleY(.12);}
  .psvg .legA,.psvg .legB{transform-box:fill-box; transform-origin:50% 8%;}
  .pet.walking .psvg .legA{animation:legk .5s ease-in-out infinite;}
  .pet.walking .psvg .legB{animation:legk .5s ease-in-out infinite; animation-delay:-.25s;}
  @keyframes legk{0%,100%{transform:rotate(13deg);}50%{transform:rotate(-13deg);}}
  .psvg .wing{transform-box:fill-box; transform-origin:90% 95%;}
  .pet-dragon .psvg .wing{animation:flapk .9s ease-in-out infinite;}
  @keyframes flapk{0%,100%{transform:rotate(2deg);}50%{transform:rotate(-16deg);}}
  .psvg .ear{transform-box:fill-box; transform-origin:50% 95%; animation:eartw 6s ease-in-out infinite;}
  .psvg .ear2{animation-delay:.2s;}
  @keyframes eartw{0%,86%,94%,100%{transform:rotate(0deg);}89%{transform:rotate(-9deg);}92%{transform:rotate(5deg);}}
  .card .ce svg{width:42px; height:38px; display:block;}
 
  /* ===== 畑（土の畝） ===== */
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; position:relative; z-index:4;}
  .plot{
    position:relative; min-height:100px; border-radius:12px; padding:8px 4px 0px;
    text-align:center; cursor:pointer;
    background:
      radial-gradient(rgba(0,0,0,.14) 1.5px, transparent 1.8px),
      radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.3px),
      linear-gradient(180deg,var(--soil1),var(--soil2));
    background-size:13px 13px, 7px 9px, 100% 100%;
    border-bottom:4px solid var(--soil3);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.3);
    transition:filter .8s;
  }
  .w-rain .plot:not(.empty):not(.buy){filter:brightness(.84) saturate(1.2);}
  .w-snow .plot:not(.empty):not(.buy){filter:brightness(.95) saturate(.92);}
  .plot .pemoji{font-size:33px; line-height:1.2; min-height:42px; position:relative;}
  .cshadow{
    position:absolute; left:50%; bottom:-3px; transform:translateX(-50%);
    background:rgba(0,0,0,.45); border-radius:50%; z-index:0; pointer-events:none;
    animation:cropsh .6s ease-in-out infinite alternate;
  }
  .plot.ready .pemoji span{position:relative; z-index:3;}
  @keyframes cropsh{from{transform:translateX(-50%) scaleX(1); opacity:.9;} to{transform:translateX(-50%) scaleX(.72); opacity:.55;}}
  .plot .pemoji span{display:inline-block; transform-origin:bottom center; position:relative; z-index:3;}
  /* 成長中作物のswayは全マスで動かす（見た目優先。一時期は発熱対策で2マスに1マスを静止させていた） */
  .plot .pemoji .grow{filter:drop-shadow(0 4px 3px rgba(0,0,0,.55));}
  .plot .pemoji .grow.sway{animation:sway 2.8s ease-in-out infinite; will-change:transform;}
  @keyframes sway{0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)}}
  .plot .pemoji.pop{animation:popk .45s;}
  @keyframes popk{0%{transform:scale(.5)} 60%{transform:scale(1.28)} 100%{transform:scale(1)}}
  .plot .pname{font-size:11px; font-weight:bold; color:var(--cream); margin-top:0; white-space:nowrap; overflow:hidden; text-shadow:0 1px 2px rgba(0,0,0,.4);}
  .plot .ptime{font-size:10px; color:var(--cream2); margin-top:0; min-height:13px;}
  .bar{height:3px; background:rgba(0,0,0,.35); border-radius:99px; margin:2px 8px 0; overflow:hidden; opacity:.87;}
  /* widthのtransitionは廃止（毎秒トリガーされるレイアウトアニメになり、成長中マス数ぶん常時レイアウト＋描画が走るため。毎秒のステップ更新で十分） */
  .bar i{display:block; height:100%; background:linear-gradient(90deg,#8ee05f,#ffd94d); border-radius:99px;}
 
  .plot.empty{
    background:linear-gradient(180deg,#a47a4d,#8c6238);
    border-bottom:4px solid #6e4a26; box-shadow:inset 0 0 0 2px rgba(255,245,220,.3), inset 0 2px 6px rgba(0,0,0,.2);
  }
  .plot.empty .pemoji{color:#f1e2c2; font-size:26px; padding-top:8px;}
 
  .plot.ready{box-shadow:inset 0 2px 6px rgba(0,0,0,.3), 0 0 0 1px rgba(245,179,1,.53);}
  /* 光輪：box-shadowは静的に描き、opacityだけを明滅（GPU合成のみで動く） */
  .glowring{
    position:absolute; inset:-3px; border-radius:14px; pointer-events:none; z-index:0;
    box-shadow:0 0 16px 4px rgba(245,179,1,.85);
    animation:pulseop 1.2s ease-in-out infinite alternate;
  }
  /* 虹色：大きく柔らかい虹のハロー。ゆっくりまたたく（opacity＋scaleのみ＝GPU合成）。
     ぼかし半径が大きいほどラスタライズ面積が増えるため、三重→二重・半径も圧縮し、
     失う派手さは明滅の振れ幅（opacity下限 .35→.26）で補う */
  .plot.m-rainbow .glowring{box-shadow:0 0 20px 5px rgba(255,110,205,.75), 0 0 38px 12px rgba(140,180,255,.45); animation:rbhalo 3.2s ease-in-out infinite alternate;}
  @keyframes pulseop{from{opacity:.35;} to{opacity:1;}}
  @keyframes rbhalo{0%{opacity:.26; transform:scale(.92);} 100%{opacity:1; transform:scale(1.13);}}
  .plot.ready .pemoji .bounce{animation:bounce .6s ease-in-out infinite alternate;}
  @keyframes bounce{from{transform:translateY(0) scale(1)} to{transform:translateY(-5px) scale(1.1)}}
  /* 発熱対策：収穫可マスの✨は削除（跳ね＋光輪で合図は伝わる。常時アニメを1つ削減） */
  @keyframes twink{from{opacity:.2; transform:scale(.7)} to{opacity:1; transform:scale(1.2)}}
 
  .plot.buy{background:rgba(255,255,255,.12); border:2px dashed rgba(255,255,255,.45); border-bottom-width:2px; box-shadow:none;}
  .plot.buy .pname,.plot.buy .ptime{color:#eef6ea;}
  .plot.buy .pemoji{font-size:28px; padding-top:6px;}
 
  /* ===== 変異の見た目 ===== */
  .plot.m-gold{box-shadow:inset 0 2px 6px rgba(0,0,0,.3), 0 0 14px rgba(255,215,0,.65);}
  .plot.m-gold .pemoji span{filter:sepia(1) saturate(2.6) brightness(1.3) drop-shadow(0 0 6px #ffd700);}
  /* 金の作物：アイコン背後に淡い金色の光をふわっと脈動させる */
  .plot.m-gold .pemoji::before{
    content:""; position:absolute; left:50%; top:50%; width:52px; height:52px;
    transform:translate(-50%,-50%); border-radius:50%; z-index:0; pointer-events:none;
    background:radial-gradient(circle, rgba(255,206,64,.94) 0%, rgba(255,206,64,.43) 45%, rgba(255,206,64,0) 70%);
    animation:goldglow 1s ease-in-out infinite alternate;
  }
  .plot.m-gold.m-giant .pemoji::before{width:80px; height:80px;}
  @keyframes goldglow{from{opacity:.3; transform:translate(-50%,-50%) scale(.82);} to{opacity:.85; transform:translate(-50%,-50%) scale(1.12);}}
  .plot.m-giant{z-index:2;}
  .plot.m-giant .pemoji{font-size:58px; position:relative; height:42px; min-height:42px; margin-top:0;}
  /* 直下のspanのみ（虹色の内側span .hue は絶対配置しない） */
  .plot.m-giant .pemoji>span{position:absolute; bottom:-4px; left:0; right:0; text-align:center; line-height:1; z-index:3; filter:drop-shadow(0 5px 7px rgba(0,0,0,.45));}
  .plot.m-rainbow{box-shadow:inset 0 2px 6px rgba(0,0,0,.3), 0 0 0 2px rgba(255,120,220,.7);}
  /* hue-rotateフィルタは連続アニメだと毎フレーム再描画になるため、8コマ送りに */
  /* 色相回転は内側の .hue に分離する。揺れ/跳ね（transform）と同じ要素で走らせると、
     合成レイヤーにコマ送りのたびfilterを適用し直すことになり再ラスタライズが重い。
     揺れ＝外側span（.sway/.bounce）、色＝内側span（.hue）で担当を分ける */
  .plot.m-rainbow .pemoji .hue{animation:hueloop 4.8s steps(6) infinite;}
  /* drop-shadowはぼかしパスが入り、コマが進むたび高コスト。白い光彩は .pemoji::before が担っているのでfilterから外す。
     コマ数と周期も 8コマ/3.2s → 6コマ/4.8s に（再ラスタライズ 毎秒2.5回 → 1.25回） */
  @keyframes hueloop{from{filter:hue-rotate(0deg) saturate(2);} to{filter:hue-rotate(360deg) saturate(2);}}
  /* 虹色：アイコン背後の白い光彩を金作物と同テンポでチカチカ瞬かせる（opacity＋scaleのみ） */
  .plot.m-rainbow .pemoji::before{
    content:""; position:absolute; left:50%; top:50%; width:54px; height:54px;
    transform:translate(-50%,-50%); border-radius:50%; z-index:0; pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,.92) 0%, rgba(255,250,255,.45) 45%, rgba(255,255,255,0) 70%);
    animation:rbwtwink 1.8s ease-in-out infinite alternate;
  }
  .plot.m-rainbow.m-giant .pemoji::before{width:82px; height:82px;}
  @keyframes rbwtwink{from{opacity:.3; transform:translate(-50%,-50%) scale(.8);} to{opacity:.9; transform:translate(-50%,-50%) scale(1.14);}}
  /* 虹色：金寄りSVG粒子がキラッと出現→回転→消滅（畑・展示で共通） */
  .rbspark,.tspark{position:absolute; pointer-events:none; opacity:0;}
  .rbspark{z-index:4;}
  .rbspark.s1{top:9px; left:55%; width:16px; height:16px; animation:rbtw 3.6s ease-in-out infinite;}
  .rbspark.s2{top:39px; left:27%; width:12px; height:12px; animation:rbtw 3.6s ease-in-out 1.2s infinite;}
  .rbspark.s3{top:24px; left:30%; width:10px; height:10px; animation:rbtw 3.6s ease-in-out 2.4s infinite;}
  @keyframes rbtw{0%{opacity:0; transform:scale(.3) rotate(0deg);}30%{opacity:1; transform:scale(1.1) rotate(25deg);}60%{opacity:0; transform:scale(.5) rotate(45deg);}100%{opacity:0;}}
  /* 展示だな（飾ったとき）の虹色きらめき */
  .tglow{position:absolute; left:50%; top:50%; width:44px; height:44px; transform:translate(-50%,-50%); border-radius:50%; z-index:0; pointer-events:none; background:radial-gradient(circle, rgba(255,255,255,.9) 0%, rgba(255,250,255,.4) 45%, rgba(255,255,255,0) 70%); animation:rbwtwink 1.8s ease-in-out infinite alternate;}
  .trophywrap.giant .tglow{width:64px; height:64px;}
  .tspark{z-index:2;}
  .tspark.s1{top:0; right:-7px; width:14px; height:14px; animation:rbtw 3.6s ease-in-out infinite;}
  .tspark.s2{bottom:8px; left:-7px; width:11px; height:11px; animation:rbtw 3.6s ease-in-out 1.2s infinite;}
  .tspark.s3{top:9px; left:-3px; width:9px; height:9px; animation:rbtw 3.6s ease-in-out 2.4s infinite;}
  /* 巨大な虹色作物：作物が大きいぶん粒子も拡大し、外側へ広げる */
  .plot.m-giant.m-rainbow .rbspark.s1{top:3px; left:60%; width:25px; height:25px;}
  .plot.m-giant.m-rainbow .rbspark.s2{top:48px; left:18%; width:19px; height:19px;}
  .plot.m-giant.m-rainbow .rbspark.s3{top:26px; left:22%; width:15px; height:15px;}
  .trophywrap.giant .tspark.s1{top:-5px; right:-12px; width:22px; height:22px;}
  .trophywrap.giant .tspark.s2{bottom:6px; left:-12px; width:17px; height:17px;}
  .trophywrap.giant .tspark.s3{top:6px; left:-6px; width:13px; height:13px;}
  /* 動き軽減設定の端末では、粒子・白い光彩は“点いたまま静止”させる（特別感は残しつつ動かさない） */
  @media (prefers-reduced-motion: reduce){
    .rbspark,.tspark{opacity:1 !important; animation:none !important;}
    .plot.m-rainbow .pemoji::before,.tglow{animation:none !important; opacity:.7 !important;}
  }

  body.app-hidden *{animation-play-state:paused !important;}

const RARE_IDS=["dragonf","peach","watermelon","moon","star"];

const SHOP_MIN_KINDS=4; /* 1入荷で並ぶ種チップの最小種類数（不足時は未入荷から補充） */
/* 🎫VIPカード所持で入荷の種類数が上限・下限とも+1（7→8 / 4→5）。
   🎟️VIPカードプラス（改造ずみ）なら+2（7→9 / 4→6）。vipPlusはvipの上位で、両方trueでも+2止まり */
const vipBonus=()=>(state.tools&&state.tools.vipPlus)?2:(state.tools&&state.tools.vip)?1:0;
const shopMaxKinds=()=>SHOP_MAX_KINDS+vipBonus();
const shopMinKinds=()=>SHOP_MIN_KINDS+vipBonus();
const MUTS=[
  {id:"normal",       name:"ふつう",     badge:"",      mult:1,   color:"normal",  giant:false},
  {id:"gold",         name:"金",         badge:"✨",    mult:5,   color:"gold",    giant:false},
  {id:"giant",        name:"巨大",       badge:"🌟",    mult:7,   color:"normal",  giant:true},

  {id:"rainbowgiant", name:"虹色巨大",   badge:"🌈🌟",  mult:280, color:"rainbow", giant:true},
];
function comboId(color,giant){
  if(color==="normal") return giant?"giant":"normal";
  return giant?color+"giant":color;
}
const PETS=[
  {id:"cat",    name:"ねこ",     e:"🐱", cost:800,   desc:"成長スピード +5%"},
  {id:"rabbit", name:"うさぎ",   e:"🐰", cost:3000,  desc:"変異の確率 ×1.1"},
  {id:"owl",    name:"ふくろう", e:"🦉", cost:10000, desc:"売値 +5%"},
  {id:"dragon", name:"ドラゴン", e:"🐲", cost:50000, desc:"成長・変異・売値 すべて+3%"},
  {id:"blackcat",name:"黒ねこ",  e:"🐈‍⬛", cost:150000, desc:"巨大変異の確率 ×1.1"},
  {id:"dog",    name:"いぬ",     e:"🐕", cost:200000, desc:"育った作物を自動で収穫"},
];
const PLOT_COSTS=[0,0,0,0,250,650,1500,4000,10000,25000,65000,150000,380000,950000,2400000];
/* ホームセンター（ペット画面下部）で売る道具。在庫は state.tools で管理。
   kind: "stack"=消耗累積(上限あり) / "charge"=耐久累積(上限あり) / "once"=買い切り(所持フラグ) */
/* 表示順は定価（cost）の安い順。カカシは耐久で価格が変動するが定価基準で固定 */
const GEARS=[
  {id:"scarecrow", kind:"charge", name:"カカシ",         e:"🤷", cost:500,  cap:3, add:3, single:true, desc:"カラスからはたけを守る"},
  {id:"sickle",    kind:"once",   name:"ハサミ",         e:"✂️", cost:2500, desc:"まとめて収穫 がスピードアップ"},
  {id:"sprinkler", kind:"stack",  name:"スプリンクラー", e:"🚿", cost:3000, cap:7, daily:true, desc:"1時間 成長×2 （1日1個）"},
  {id:"vip",       kind:"once",   name:"VIPカード",      e:"🎫", cost:100000, desc:"タネ屋の入荷＋1種類"},
];
/* 買い切り道具の「改造」：所持中に同じ行をもう一度買うと上位版になる（買い切り・行は増やさず昇格）。
   flag=state.toolsに立てるキー／owned=所持中（改造前）の説明／name,e,desc=改造ずみの表示 */
const UPGRADES={
  sickle:{ flag:"sicklePlus", cost:25000,  name:"いいハサミ",       e:"✂️",
           owned:"まとめて収穫 がスピードアップ",
           desc:"まとめて収穫 がよりスピードアップ",
           bt:"✂️ いいハサミ！", bs:"まとめて収穫が もっと速くなった！" },
  vip:{    flag:"vipPlus",     cost:250000, name:"VIPカード プラス", e:"🎟️",
           owned:"タネ屋の入荷＋1種類（改造すると＋2に）",
           desc:"タネ屋の入荷＋2種類",
           bt:"🎟️ VIPカード プラス！", bs:"タネ屋の入荷が ＋2種類 になった！" },
};
/* 改造ずみか／いま改造できるか（＝本体を持っていて、まだ改造していない） */
const upDone=id=>{ const u=UPGRADES[id]; return !!(u && state.tools && state.tools[u.flag]); };
const upReady=id=>{ const u=UPGRADES[id]; return !!(u && state.tools && state.tools[id] && !state.tools[u.flag]); };
const MAX_PLOTS=PLOT_COSTS.length;
/* カカシの価格：耐久0=新規500／耐久1=修理300／耐久2=修理150／耐久3(満タン)=購入不可0。買う/直すと耐久3に回復 */
function scarecrowCost(){
  const d=(state.tools&&state.tools.scarecrow)||0;
  if(d>=3) return 0;
  if(d===2) return 150;
  if(d===1) return 300;
  return 500;
}
/* 道具の現在価格（カカシは耐久で変動、改造できる道具は所持中なら改造料、他は固定cost） */
function gearCost(g){
  if(g.id==="scarecrow") return scarecrowCost();
  if(upReady(g.id)) return UPGRADES[g.id].cost; /* 改造 */
  return g.cost;
}
const SAVE_KEY="fushigi-garden-v1";
 
/* 作物ごとの表示アイコン倍率（畑・展示で共通。pineapple=パイナップル, dragonf=メロン） */
const ICON_SCALE={pineapple:1.5,dragonf:1.3,grape:1.15,onion:1.1,chili:0.85,corn:1.05,broccoli:1.05,potato:0.85,sweetpotato:0.75,garlic:0.65,watermelon:1.15,peanut:0.9,pepper:0.95,olive:0.45,edamame:1.05};
const iconScaleOf=id=>ICON_SCALE[id]||1;
/* 種チップ内のアイコン倍率の上書き（未指定はICON_SCALEを流用）。畑/展示とチップで別サイズにしたい作物用 */
const CHIP_SCALE={sweetpotato:0.75, olive:0.8};
const chipScaleOf=id=>CHIP_SCALE[id]||ICON_SCALE[id]||1;

/* 作物の表示アイコンHTML（SVGがあればSVG、無ければ絵文字）。textContent系（トースト/飛ぶ粒子）では使わない */
function cropGlyph(crop){ if(!crop) return ""; return CROP_SVG[crop.id]||crop.e; }
/* id→オブジェクトの参照は毎秒多数回引かれるので Map で O(1) に */
const CROP_BY_ID=new Map(CROPS.map(c=>[c.id,c]));
const MUT_BY_ID =new Map(MUTS.map(m=>[m.id,m]));
const cropOf=id=>CROP_BY_ID.get(id);
const mutOf =id=>MUT_BY_ID.get(id);
/* 変異の色軸・巨大フラグは MUTS の定義から引く（id文字列の includes 依存をやめる） */
const colorOf=id=>{ const m=MUT_BY_ID.get(id); return m?m.color:"normal"; };
const isGiant=id=>{ const m=MUT_BY_ID.get(id); return m?!!m.giant:false; };
/* どうぐ（消耗品肥料）。育成中の作物にまくと、その作物1サイクルだけ変異確率が上がる。
   axis=p.boostsに書くキー（goldMult=金/giantMult=巨大）。mult(cropId)=作物別倍率（星×4/他×8） */
const FERTS=[
  {id:"fert_gold",  e:"✨", name:"きらめき肥料", cost:15000, axis:"goldMult",  badge:"✨", mult:(cid)=>(cid==="star"||cid==="moon")?4:8, effect:"金変異がアップ",   desc:"金変異アップ（収穫まで）\n育てている作物をタップ"},
  {id:"fert_giant", e:"🌟", name:"グングン肥料", cost:25000, axis:"giantMult", badge:"🌟", mult:(cid)=>(cid==="star"||cid==="moon")?4:8, restock:0.7, effect:"巨大変異がアップ", desc:"巨大変異アップ（収穫まで）\n育てている作物をタップ"},
];
const FERT_BY_ID=new Map(FERTS.map(f=>[f.id,f]));
const FERT_STOCK=1; /* 肥料ごとに1入荷=1個（種と同じ15分周期で shopTick がリセット） */
/* 入荷率：restock未指定は100%入荷。指定があれば期ごとに確率抽選（期内は固定・リロードでも不変） */
function fertStockedThisPeriod(f){
  const p=(f.restock===undefined?1:f.restock);
  if(p>=1) return true;
  const idx=FERTS.findIndex(x=>x.id===f.id);
  const rng=mulberry32((curPeriod()^(0x5bd1e995+idx*0x9E3779B9))>>>0);
  return rng()<p;
}
function fertStockLeft(id){
  const f=FERT_BY_ID.get(id);
  if(f && !fertStockedThisPeriod(f)) return 0; /* 今期は入荷なし→うりきれ扱い */
  return FERT_STOCK-(state.shopBought[id]||0);
}
function fertVisible(f){ return !!(state.fertUnlock&&state.fertUnlock[f.id]) || state.coins>=f.cost; }
/* そのマスに既に何らかの肥料がまかれているか（1マス1肥料の制限用） */
function plotHasFert(p){ return !!(p&&p.boosts&&FERTS.some(f=>p.boosts[f.axis])); }
/* 初めて各肥料の入荷ラインに達したら以降ずっと解禁（肥料ごとに1回だけ告知） */
function checkFertUnlock(silent){
  if(!state.fertUnlock) state.fertUnlock={};
  let any=false;
  for(const f of FERTS){
    if(!state.fertUnlock[f.id] && state.coins>=f.cost){
      state.fertUnlock[f.id]=true; any=true;
      if(!silent){ toast(`${f.e}${f.name}\n入荷！`,3000,true); beep(880,0.18); }
    }
  }
  return any;
}
/* 変異名＋作物名。「巨大」で終わる変異は「な」、それ以外は「の」で接続。ふつうは作物名のみ */
function mutCropName(mut,cropName){
  if(!mut||!mut.name||mut.id==="normal") return cropName;
  return mut.name+(mut.name.endsWith("巨大")?"な":"の")+cropName;
}

/* デイリー切り替えは午前4時（JST）。4時間ぶん戻した時刻の Asia/Tokyo 日付を「その日」とみなす */
function todayStrJST(){ const d=new Date(Date.now()-4*3600*1000); try{ return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo"}).format(d); }catch(e){ return d.toISOString().slice(0,10); } }

/* 内容が前回保存と同一なら localStorage 書き込みを省略（lastSeenは実際に書く時だけ更新）。
   作物が育っている間は progress が毎ティック変わるので通常どおり保存され、
   完全にアイドルな時だけ書き込みI/Oをスキップする */
/* ===== セーブの難読化＋改ざん検出（client-side：完全防御ではなくカジュアル改ざん抑止） =====
   形式 "FG1.<base64(XOR難読化)>.<鍵付きタグ>"。同期処理なので離脱時保存にも使える。 */
const SAVE_SECRET="fg-7c1e9d3a-tekuzo-v1";
function _saveSeed(){ let h=2166136261; for(let i=0;i<SAVE_SECRET.length;i++){ h^=SAVE_SECRET.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function _xorBytes(bytes){ const rnd=mulberry32(_saveSeed()); const o=new Uint8Array(bytes.length); for(let i=0;i<bytes.length;i++) o[i]=bytes[i]^((rnd()*256)|0); return o; }
function _b64enc(b){ let s=""; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function _b64dec(s){ const a=atob(s),o=new Uint8Array(a.length); for(let i=0;i<a.length;i++) o[i]=a.charCodeAt(i); return o; }
function _saveTag(body){ let h=2166136261; const m=SAVE_SECRET+"|"+body; for(let i=0;i<m.length;i++){ h^=m.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(16); }
/* 本体は base64url（- _ ・パディング無し）で出力。+ / = を排除し、iOSの共有→ファイル→読込での文字化けを防ぐ */
function encodeSave(jsonStr){ const body=_b64enc(_xorBytes(new TextEncoder().encode(jsonStr))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); return "FG1."+body+"."+_saveTag(body); }
function decodeSave(container){
  if(typeof container!=="string") return null;
  if(container.charCodeAt(0)===0xFEFF) container=container.slice(1); /* 先頭BOMを除去 */
  container=container.trim(); /* 前後の空白/改行を除去（iOS Files等での混入対策） */
  const p=container.split("."); if(p.length!==3||p[0]!=="FG1") return null;
  const body=p[1].replace(/\s+/g,""); /* 本体内に混入した空白/改行を除去 */
  if(_saveTag(body)!==p[2].trim()) return null; /* 改ざん/破損は無効 */
  try{
    let b=body.replace(/-/g,"+").replace(/_/g,"/"); /* base64url→標準（旧標準base64もそのまま通る） */
    while(b.length%4) b+="="; /* パディング復元 */
    return new TextDecoder().decode(_xorBytes(_b64dec(b)));
  }catch(e){ return null; }
}
 
let _lastSaveStr=null;
function save(){
  if(_restoring) return; /* 復元中はリロード直前の上書き保存を抑止 */
  fgSetCoinsBucket(); /* 案2：資産帯をユーザープロパティへ（変化時のみ送信） */
  let str;
  try{ str=JSON.stringify(state); }catch(e){ return; }
  if(str===_lastSaveStr) return;
  state.lastSeen=Date.now();
  try{ str=JSON.stringify(state); localStorage.setItem(SAVE_KEY,encodeSave(str)); _lastSaveStr=str; }catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    /* 旧平文(JSON)は後方互換でそのまま読む。新形式(FG1.)はデコード。改ざん/破損はnull */
    const jsonStr = raw.charAt(0)==="{" ? raw : decodeSave(raw);
    if(jsonStr==null) return null;
    const s=JSON.parse(jsonStr);
    if(!s||!Array.isArray(s.plots)) return null;
    const st=Object.assign(newState(),s);
    st.plots.forEach(p=>{
      if(!p.mut) p.mut="normal";
      if(isGiant(p.mut)&&!p.gsize) p.gsize=1.5;
      if(p.seed&&p.progress>=1&&!p.readyAt) p.readyAt=Date.now();
    });
    while(st.plots.length<MAX_PLOTS) st.plots.push({seed:null,progress:0,mut:"normal"}); /* マス数拡張時の配列補完 */
    if(!st.shopBought) st.shopBought={};
    if(!st.inv) st.inv={};
    if(!st.invG) st.invG={};
    if(!Array.isArray(st.display)) st.display=[];
    st.display.forEach(d=>{ if(isGiant(d.mut)&&!d.gsize) d.gsize=1.5; });
    if(!st.login||typeof st.login.dayIndex!=="number") st.login={dayIndex:0,lastClaimDate:""};
    if(!st.giftSeeds||typeof st.giftSeeds!=="object") st.giftSeeds={};
    if(!st.tools||typeof st.tools!=="object") st.tools={sprinkler:0};
    if(typeof st.tools.sprinkler!=="number") st.tools.sprinkler=0;
    if(typeof st.boostUntil!=="number") st.boostUntil=0;
    if(!st.crow||typeof st.crow!=="object") st.crow={lastDate:"",count:0};
    if(typeof st.crow.count!=="number") st.crow.count=0; /* 旧セーブ（回数フィールドなし）の補完 */
    if(typeof st.bgmMuted!=="boolean") st.bgmMuted=false;
    if(!st.fertUnlock||typeof st.fertUnlock!=="object") st.fertUnlock={};
    if(st.fertUnlocked && !st.fertUnlock.fert_gold) st.fertUnlock.fert_gold=true; /* 旧フラグから移行 */
    /* CROPSから消えた作物（実装を取り下げた等）がセーブに残っていても壊れないよう掃除する。
       cropOf()がundefinedを返すidを参照したまま描画すると例外で画面が止まるため */
    const liveCrop=k=>!!cropOf(String(k).split(":")[0]);
    st.plots.forEach(p=>{ if(p.seed&&!cropOf(p.seed)){ p.seed=null; p.progress=0; p.mut="normal"; p.readyAt=0; } });
    for(const k of Object.keys(st.inv))   if(!liveCrop(k)) delete st.inv[k];
    for(const k of Object.keys(st.invG))  if(!liveCrop(k)) delete st.invG[k];
    for(const k of Object.keys(st.dex||{}))       if(!liveCrop(k)) delete st.dex[k];
    for(const k of Object.keys(st.giftSeeds))     if(!liveCrop(k)) delete st.giftSeeds[k];
    for(const k of Object.keys(st.shopBought))    if(!liveCrop(k)) delete st.shopBought[k];
    st.display=st.display.filter(d=>d&&cropOf(d.crop));
    if(st.selectedSeed && st.selectedSeed.indexOf("gift:")!==0 && !cropOf(st.selectedSeed)) st.selectedSeed=CROPS[0].id;
    return st;
  }catch(e){ return null; }
}
 
/* ============ セーブのバックアップ（ファイル書き出し／復元） ============ */
function twoDigit(n){ return String(n).padStart(2,"0"); }
function backupStamp(){
  const d=new Date();
  return {
    file:`${d.getFullYear()}${twoDigit(d.getMonth()+1)}${twoDigit(d.getDate())}${twoDigit(d.getHours())}${twoDigit(d.getMinutes())}`,
    human:`${d.getFullYear()}-${twoDigit(d.getMonth()+1)}-${twoDigit(d.getDate())} ${twoDigit(d.getHours())}:${twoDigit(d.getMinutes())}`
  };
}
/* 書き出し：モバイルは共有シート、未対応はダウンロード */
function doBackupSave(){
  const st=backupStamp();
  let container;
  try{ container=encodeSave(JSON.stringify({app:"fushigi-garden", ver:1, ts:Date.now(), savedAt:st.human, state})); }
  catch(e){ toast("書き出しに失敗しました",2400,true); return; }
  fgEvent("fushigi_backup_export",{}); /* セーブ書出 */
  const fname=`fushigi${st.file}save.fgsave`;
  const blob=new Blob([container],{type:"text/plain"});
  /* タッチ端末のみ共有シートを使う（デスクトップの共有シートは「ファイル保存」が無く保存できないため、
     PC/マウス環境では下のダウンロードに直行する） */
  const isTouch=(matchMedia&&matchMedia("(pointer:coarse)").matches)||navigator.maxTouchPoints>0;
  /* ボタンを押した時点で案内（押下時に表示）。タッチ=共有シート操作を促す／デスクトップ=自動ダウンロード */
  toast(isTouch?"💾 ファイルに保存してください":"💾 ファイルに保存します",2400,true);
  if(isTouch){
    try{
      const file=new File([blob],fname,{type:"text/plain"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:"ふしぎ植物園のセーブ"})
          .catch(()=>{}); /* キャンセルは無視 */
        return;
      }
    }catch(e){}
  }
  /* フォールバック：ダウンロード（デスクトップは常にこちら） */
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
/* 復元：ファイルを選んで読み込み→確認モーダル */
function doBackupLoad(){
  const inp=document.createElement("input");
  inp.type="file"; /* accept指定なし＝ファイル名/拡張子を問わず選択可。中身はdecodeSaveで判定 */
  inp.style.display="none";
  inp.addEventListener("change",()=>{
    const f=inp.files&&inp.files[0]; inp.remove();
    if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      /* バックアップファイルはFG1形式のみ受理（平文の手作り＝改ざんは拒否） */
      const jsonStr=decodeSave(fr.result);
      if(jsonStr==null){
        const raw=String(fr.result||""); /* 失敗時は中身の先頭と文字数を表示して原因特定の手がかりに */
        toast("このファイルは読み込めません\n先頭:"+raw.replace(/\s/g,"·").slice(0,18)+" / "+raw.length+"字",4000,true);
        return;
      }
      let p; try{ p=JSON.parse(jsonStr); }catch(e){ toast("このファイルは読み込めません",2400,true); return; }
      /* ラッパー形式 {state} と、素の state の両方を許容 */
      const st=(p&&Array.isArray(p.plots))?p:((p&&p.state&&Array.isArray(p.state.plots))?p.state:null);
      if(!st){ toast("このファイルは読み込めません",2400,true); return; }
      pendingRestore={state:st, savedAt:(p&&p.savedAt)||""};
      showRestoreConfirm(pendingRestore);
    };
    fr.onerror=()=>toast("読み込みに失敗しました",2400,true);
    fr.readAsText(f);
  });
  document.body.appendChild(inp);
  inp.click();
}
function showRestoreConfirm(p){
  const s=p.state||{};
  const when=p.savedAt?`<b>${p.savedAt}</b> のデータ<br>`:"";
  const ov=document.getElementById("overlay");
  ov.innerHTML=`
    <div class="mcard">
      <div class="me">📂</div>
      <div class="mt">バックアップから復元</div>
      <div class="mv">${when}🪙 ${fmt(s.coins||0)}／📖 ${Object.keys(s.dex||{}).length}種／🧺 ${fmt(s.totalHarvests||0)}回<br><br>⚠️ 今のデータは上書きされます。</div>
      <div class="mbtns">
        <button class="mclose" data-act="closeModal">やめる</button>
        <button class="mkeep" data-act="backupRestore">📂 復元する</button>
      </div>
    </div>`;
  ov.classList.add("show");
}
/* 復元実行：取り込んだ state を SAVE_KEY に書き、load()/マイグレーションを通すためリロード */
function applyRestore(){
  const p=pendingRestore;
  if(!p||!p.state||!Array.isArray(p.state.plots)){ toast("復元できませんでした",2400,true); return; }
  _restoring=true; /* 以後 save() を止め、リロード直前の上書きを防止 */
  try{ localStorage.setItem(SAVE_KEY, encodeSave(JSON.stringify(p.state))); }
  catch(e){ _restoring=false; toast("復元に失敗しました",2400,true); return; }
  fgEvent("fushigi_backup_import",{}); /* セーブ読込 */
  location.reload();
}
 
/* ============ アナリティクス（GA4カスタムイベント：接頭辞 fushigi_） ============ */
/* 生涯1回イベント/マイルストーンの記録。ゲームのセーブとは別キーに保存し、
   リセットや復元の影響を受けない＝同じ端末での二重カウントを防ぐ */
const ANALYTICS_KEY="fg-analytics-v1";
let _fgFlags=null;
function fgFlags(){
  if(_fgFlags) return _fgFlags;
  try{ _fgFlags=JSON.parse(localStorage.getItem(ANALYTICS_KEY))||{}; }catch(e){ _fgFlags={}; }
  return _fgFlags;
}
function fgFlagsSave(){ try{ localStorage.setItem(ANALYTICS_KEY,JSON.stringify(fgFlags())); }catch(e){} }
function fgEvent(name,params){ try{ if(typeof gtag==="function") gtag("event",name,params||{}); }catch(e){} }
/* 生涯1回だけ送る（例：初回植え付け・初回収穫） */
function fgOnce(flag,name,params){ const f=fgFlags(); if(f[flag]) return; f[flag]=1; fgFlagsSave(); fgEvent(name,params); }
/* 案2：所持コインを資産帯（低カーディナリティ）にしてユーザープロパティへ設定（変化時のみ） */
function coinsBucket(c){
  if(c<100) return "0-99";
  if(c<1000) return "100-999";
  if(c<10000) return "1k-9999";
  if(c<100000) return "10k-99999";
  if(c<1000000) return "100k-999999";
  return "1M+";
}
let _fgCoinsBucket=null;
function fgSetCoinsBucket(){
  const b=coinsBucket((typeof state!=="undefined"&&state.coins)||0);
  if(b===_fgCoinsBucket) return;
  _fgCoinsBucket=b;
  try{ if(typeof gtag==="function") gtag("set","user_properties",{coins_bucket:b}); }catch(e){}
}
/* 図鑑の進捗マイルストーン（25/50/75%）とコンプ。収穫のたびに呼ぶ（各しきい値は1回だけ発火） */
function fgCheckDex(){
  const total=CROPS.length*MUTS.length;
  const found=Object.keys(state.dex).length;
  const pct=found/total*100;
  const f=fgFlags(); let dirty=false;
  for(const th of [25,50,75]){ if(pct>=th && !f["dex"+th]){ f["dex"+th]=1; dirty=true; fgEvent("fushigi_dex_milestone",{percent:th}); } }
  if(found>=total && !f.dexComplete){ f.dexComplete=1; dirty=true; fgEvent("fushigi_dex_complete",{found}); }
  if(dirty) fgFlagsSave();
}
 
/* ============ ペット効果・天候・時間帯 ============ */
const hasPet=id=>!!state.pets[id];
function growthMult(online){
  let m=1+(hasPet("cat")?0.05:0)+(hasPet("dragon")?0.03:0);
  if(online && isBonusWx(weatherNow().id)) m*=2;
  return m;
}
/* ===== スプリンクラー（マス単位の一時ブースト：成長×2＋変異×2、1時間。雨/雪とは重複せず×2上限） ===== */
const SPRINKLER_MS=3600000;   /* 効果1時間 */
const SPRINKLER_MAX=7;        /* 在庫上限 */
const SPR='<span class="spr">🚿</span>'; /* 1.5倍表示のスプリンクラーアイコン（HTML描画用） */
const GFT='<span class="gft">🎁</span>'; /* ログボのスタンプ用プレゼントアイコン（1.2倍） */
function sprinklerCount(){ return (state.tools&&state.tools.sprinkler)||0; }
function plotWet(p,now){ return !!(p&&p.boosts&&p.boosts.wetUntil&&(now||Date.now())<p.boosts.wetUntil); }
/* dtSec のうち wet だった秒数（雨/雪はプレイ中のみ全体、スプリンクラーは窓との重なり）。両方でも×2上限（乗算しない） */
function plotWetSec(p,now,dtSec,online){
  if(online && isBonusWx(weatherNow().id)) return dtSec;
  const W=(p.boosts&&p.boosts.wetUntil)||0;
  if(W<=0) return 0;
  const s=Math.max(now-dtSec*1000, W-SPRINKLER_MS), e=Math.min(now, W);
  return e>s ? (e-s)/1000 : 0;
}
/* 収穫/植え直し/廃棄でも土のしめり（wetUntil）はマスに残す（案B：土に1時間） */
function keepWet(boosts,now){ now=now||Date.now(); return (boosts&&boosts.wetUntil&&now<boosts.wetUntil)?{wetUntil:boosts.wetUntil}:null; }
function sellMult(){ return (hasPet("owl")?1.05:1)*(hasPet("dragon")?1.03:1)*(1+0.05*state.display.length); }
 
/* ============ カゴ（インベントリ）と展示 ============ */
const DISPLAY_MAX=4;
const invCount=()=>Object.values(state.inv).reduce((a,b)=>a+b,0);
function invAdd(key,n){ state.inv[key]=(state.inv[key]||0)+n; }
function unitValue(crop,mut){ return Math.floor(crop.sell*mut.mult*sellMult()); }
/* 巨大作物の個体別サイズ配列を inv 個数に合わせて返す（invG不足分は1.5で補完・非破壊） */
function giantSizesOf(key){
  const n=state.inv[key]||0;
  const arr=(state.invG[key]||[]).slice(0,n);
  while(arr.length<n) arr.push(1.5);
  return arr;
}
function invList(){
  const out=[];
  for(const c of CROPS) for(const m of MUTS){
    const k=c.id+":"+m.id, n=state.inv[k];
    if(!(n>0)) continue;
    if(isGiant(m.id)){
      /* 巨大は見た目サイズ（小数1桁）ごとに行を分ける */
      const bySize=new Map();
      for(const g of giantSizesOf(k)){ const s=g.toFixed(1); bySize.set(s,(bySize.get(s)||0)+1); }
      [...bySize.keys()].sort((a,b)=>parseFloat(b)-parseFloat(a))
        .forEach(s=>out.push({key:k,crop:c,mut:m,count:bySize.get(s),gsize:s}));
    }else{
      out.push({key:k,crop:c,mut:m,count:n});
    }
  }
  return out;
}
 
/* 東京のリアル天気（Open-Meteoから取得）。"clear"|"cloud"|"rain"|"snow" */
let realWx="clear";
const RAIN_CODES=[51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99]; // 霧雨〜雷雨
const SNOW_CODES=[71,73,75,77,85,86];                               // 雪・霧雪・にわか雪
const CLOUD_CODES=[2,3,45,48];                                     // 一部曇り・曇り・霧
function wxFromCode(c){
  if(RAIN_CODES.includes(c)) return "rain";
  if(SNOW_CODES.includes(c)) return "snow";
  if(CLOUD_CODES.includes(c)) return "cloud";
  return "clear"; // 0=快晴, 1=おおむね晴れ
}
function fetchTokyoWeather(){
  /* 8秒で打ち切り（ハング防止）。失敗時は前回値（初期はclear=はれ）を維持 */
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(),8000);
  fetch("https://api.open-meteo.com/v1/forecast?latitude=35.69&longitude=139.69&current=weather_code",{signal:ctrl.signal})
    .then(r=>r.json())
    .then(j=>{ const c=j&&j.current&&j.current.weather_code; if(typeof c==="number") realWx=wxFromCode(c); })

   new Date() は1回で済み、分境界をまたぐ瞬間も呼び出し間で判定がブレない */
let _wxMemo={sec:-1,val:null};
function weatherNow(){

  const v=(h>=5&&h<8)?"t-dawn":(h>=8&&h<16)?"t-day":(h>=16&&h<19)?"t-dusk":"t-night";

/* ============ ショップ入荷（5分ごと・時刻から決定論的に生成） ============ */
let debugPeriodOffset=0; /* デバッグ：CTRL+ALT+N→Y で次の入荷へ（実時間の期番号にオフセットを加算） */
function curPeriod(){ return Math.floor(Date.now()/RESTOCK_MS)+debugPeriodOffset; }
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
let stockCache={per:-1,vip:-1,stock:null};
function shopStock(per){
  const vip=vipBonus(); /* VIP購入で種類数が変わるためキャッシュキーに含める */
  if(stockCache.per===per&&stockCache.vip===vip) return stockCache.stock;
  const rng=mulberry32(per^0x9E3779B9);
  const stock={};
  /* 作物cの在庫数を決定（qpがあれば重み付き、なければ範囲の一様分布） */
  const qtyOf=(c,q)=>{
    if(c.qp){ let acc=0; for(let k=0;k<c.qp.length;k++){ acc+=c.qp[k]; if(q<acc) return c.st[1]+k; } return c.st[2]; }
    return c.st[1]+Math.floor(q*(c.st[2]-c.st[1]+1));
  };
  for(const c of CROPS){
    const r=rng(), q=rng();
    if(r<c.st[0]) stock[c.id]=qtyOf(c,q);
  }
  /* 種チップは1入荷あたり最大7種類まで（🎫VIPカードで8種類・🎟️VIPカードプラスで9種類。肥料・スプリンクラーは別枠）。
     超過時は にんじん（スターター）を残し、それ以外からランダムに外す（期シードで決定論的） */
  const maxKinds=shopMaxKinds(), minKinds=shopMinKinds();
  const ids=Object.keys(stock);
  if(ids.length>maxKinds){
    const pool=ids.filter(id=>id!=="carrot");
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=pool[i]; pool[i]=pool[j]; pool[j]=t; } /* Fisher-Yates */
    for(const id of pool.slice(0,ids.length-maxKinds)) delete stock[id];
  }
  /* 下限を下回るなら、未入荷の作物からランダムに補充（通常4種・VIPで5種・VIPプラスで6種／期シードで決定論的） */
  if(Object.keys(stock).length<minKinds){
    const missing=CROPS.filter(c=>stock[c.id]===undefined);
    for(let i=missing.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=missing[i]; missing[i]=missing[j]; missing[j]=t; } /* Fisher-Yates */
    const need=Math.min(minKinds-Object.keys(stock).length, missing.length);
    for(let k=0;k<need;k++){ const c=missing[k]; stock[c.id]=qtyOf(c,rng()); }
  }
  stockCache={per,vip,stock};
  return stock;
}
function stockLeft(id){
  const s=shopStock(curPeriod())[id];
  if(s===undefined) return -1; /* 入荷なし */
  return Math.max(0,s-(state.shopBought[id]||0));
}

/* ============ 変異（畑にある作物にその場で起きる） ============ */
/* 色（金色・虹色）と巨大は別軸で、同時発生する */
const COLOR_RANK={normal:0,gold:1,rainbow:2};
const COLOR_TIERS=[{id:"rainbow",base:0.0025},{id:"gold",base:0.02}];
const GIANT_BASE=0.0184;
const MUT_WINDOW=600; /* 収穫可能になってから変異抽選が続く秒数（雷も対象外になる） */
 
function mutationTick(dtSec,online){
  const w=online?weatherNow().id:"clear";
  const petBoost=(hasPet("rabbit")?1.1:1)*(hasPet("dragon")?1.03:1);
  const giantBoost=hasPet("blackcat")?1.1:1; /* 黒ねこ：巨大変異の確率×1.1 */
  const now=Date.now();
  const out=[];
  for(let i=0;i<state.plotCount;i++){
    const p=state.plots[i];
    if(!p.seed) continue;
    const crop=cropOf(p.seed);
    /* 収穫可能になってから MUT_WINDOW 秒で抽選終了（成長中はつねに対象） */
    let effDt=dtSec;
    if(p.progress>=1){
      const end=Math.min(now,(p.readyAt||now)+MUT_WINDOW*1000);
      effDt=Math.max(0,(end-(now-dtSec*1000))/1000);
      if(effDt<=0) continue;
    }
    /* wet（雨/雪 or スプリンクラー）中は変異率×2。成長×2で減る抽選を相殺しレア率を据え置き。両方でも×2上限 */
    const effDtW=effDt+plotWetSec(p,now,effDt,online);
    const cur=p.mut||"normal";
    let color=colorOf(cur), giant=isGiant(cur), changed=false;
    for(const t of COLOR_TIERS){
      if(COLOR_RANK[t.id]<=COLOR_RANK[color]) continue;
      let rate=t.base*petBoost/crop.time;
      if(crop.mx&&crop.mx[t.id]) rate*=crop.mx[t.id]; /* 作物固有の変異率倍率（トウガラシ：金×2.5・虹×1.3） */
      if(t.id==="rainbow"&&w==="rainbow") rate*=3;
      if(t.id==="gold"&&p.boosts&&p.boosts.goldMult) rate*=p.boosts.goldMult; /* きらめき肥料 */
      if(Math.random()<1-Math.exp(-rate*effDtW)){ color=t.id; changed=true; break; }
    }
    if(!giant){
      let rate=GIANT_BASE*petBoost*giantBoost/crop.time;
      if(crop.mx&&crop.mx.giant) rate*=crop.mx.giant; /* 作物固有の変異率倍率（トウガラシ：巨大×2.5） */
      if(w==="rainbow") rate*=2; /* 虹タイムの隠し効果：巨大の確率×2 */
      if(p.boosts&&p.boosts.giantMult) rate*=p.boosts.giantMult; /* グングン肥料 */
      if(Math.random()<1-Math.exp(-rate*effDtW)){
        giant=true; p.gsize=1+Math.random(); changed=true;
      }
    }
    if(changed){
      const from=cur;
      p.mut=comboId(color,giant);
      fgEvent("fushigi_mutation",{mut_type:p.mut,crop_id:crop.id,source:"grow"}); /* ★変異発生 */
      out.push({i,from,to:p.mut,crop});
    }
  }
  return out;
}
 
function lightningTick(){
  if(!isBonusWx(weatherNow().id)) return;
  if(Math.random()>=0.0005) return;
  const cands=[];
  const now=Date.now();
  for(let i=0;i<state.plotCount;i++){
    const p=state.plots[i];
    const expired=p.progress>=1 && p.readyAt && now>p.readyAt+MUT_WINDOW*1000;
    if(p.seed && !p.struck && !expired && (p.mut||"normal")!=="rainbowgiant") cands.push(i);
  }
  if(!cands.length) return;
  const i=cands[Math.floor(Math.random()*cands.length)];
  const p=state.plots[i];
  const from=p.mut||"normal";
  let color=colorOf(from), giant=isGiant(from);
  const r=Math.random();
  /* 虹色1%・巨大29%・金色70%。すでに持っている変異は別の軸へ流すだけで、
     金色→虹色のような色の昇格はしない（虹色の量産防止） */
  if(r<0.01 && color!=="rainbow"){ color="rainbow"; }
  else if(r<0.30 && !giant){ giant=true; }
  else if(color==="normal"){ color="gold"; }
  else if(!giant){ giant=true; }
  if(giant&&!isGiant(from)) p.gsize=1+Math.random();
  p.mut=comboId(color,giant);
  p.struck=true; /* 雷は1つの作物に1回まで */
  if(p.mut===from) return;
  fgEvent("fushigi_mutation",{mut_type:p.mut,crop_id:cropOf(p.seed).id,source:"lightning"}); /* ★変異発生（雷） */
  lightningFX(document.querySelector(`.grid .plot[data-i="${i}"]`));

}

/* ============ カラス（オフライン限定の作物どろぼう） ============ */
const CROW_MIN_AWAY=1800;   /* 判定に必要な留守時間（30分・これ未満は発生なし） */
const CROW_MAX_AWAY=86400;  /* 確率が頭打ちになる留守時間（24時間） */
const CROW_RATE_MIN=0.15;   /* 30分ちょうどの被害確率 */
const CROW_RATE_MAX=0.85;   /* 24時間以上放置時の被害確率（頭打ち） */
const CROW_SAFE_CROPS=["star"]; /* カラスが狙わない作物（最高級の星の実は対象外） */
const CROW_MAX_PER_DAY=1;   /* カラス飛来の1日あたり上限回数 */
const CROW_MIN_COINS=3001;  /* 所持コインが3000以下のうちはカラスは飛来しない（初心者保護・通知なし） */
/* 留守時間→被害確率（30分15%〜24時間85%で線形補間・頭打ち） */
function crowRate(awaySec){
  const t=Math.max(0,Math.min(1,(awaySec-CROW_MIN_AWAY)/(CROW_MAX_AWAY-CROW_MIN_AWAY)));
  return CROW_RATE_MIN+(CROW_RATE_MAX-CROW_RATE_MIN)*t;
}
/* 帰還時精算のあとに呼ぶ。条件を満たせば対象マスから1つ持ち去り、盗まれた作物を返す（なければnull）。
   対象＝成長中×未変異×肥料なし×湿りなし×除外作物でない。オンライン中の抽選は一切行わない（1日1回キャップ）。
   growingSet を渡すと「オフライン開始時に成長中だったマス」を対象にする（留守中に育ちきっても対象）。
   未指定時は現在 progress<1 のマス（デバッグ用フォールバック） */
function crowOfflineCheck(awaySec,growingSet,force){
  if(!force && awaySec<CROW_MIN_AWAY) return null;
  if(!force && (state.coins||0)<CROW_MIN_COINS) return null; /* コイン1000未満は飛来なし（通知も出さない） */
  if(!state.crow) state.crow={lastDate:"",count:0};
  const _today=todayStrJST();
  if(state.crow.lastDate!==_today){ state.crow.lastDate=_today; state.crow.count=0; } /* 日付が変わったら回数リセット */
  if(!force && (state.crow.count||0)>=CROW_MAX_PER_DAY) return null; /* 1日の上限に達したら発生しない */
  const cands=[];
  for(let i=0;i<state.plotCount;i++){
    const p=state.plots[i];
    const wasGrowing=growingSet?growingSet.has(i):(p.progress<1);
    if(p.seed && wasGrowing && (p.mut||"normal")==="normal" && !CROW_SAFE_CROPS.includes(p.seed) && !plotHasFert(p) && !plotWet(p)) cands.push(i);
  }
  if(!cands.length) return null;
  if(!force && Math.random()>=crowRate(awaySec)) return null; /* 留守が長いほど被害確率アップ（15%〜85%） */
  const i=cands[Math.floor(Math.random()*cands.length)]; /* 対象マスはランダム選択 */
  const p=state.plots[i];
  const crop=cropOf(p.seed);
  state.crow.count=(state.crow.count||0)+1; /* 飛来した＝ブロックでも1日の回数を消費 */
  /* カカシ：耐久があればカラスを確定ブロック（作物は盗まれない・耐久−1） */
  if(state.tools && state.tools.scarecrow>0){
    state.tools.scarecrow-=1;
    return {crop, idx:i, blocked:true};
  }
  p.seed=null; p.progress=0; p.mut="normal"; p.readyAt=0; p.struck=false; p.boosts=keepWet(p.boosts);
  return {crop,idx:i};
}

/* ============ ユーティリティ ============ */
const fmt=n=>Math.floor(n).toLocaleString("ja-JP");
function fmtMin(sec){
  const m=Math.ceil(Math.max(0,sec)/60);
  const h=Math.floor(m/60), mm=m%60;
  if(h>0) return h+"時間"+(mm>0?mm+"分":"");
  return m+"分";
}
function fmtClock(sec){
  sec=Math.max(0,sec);
  return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
}
function fmtTime(sec){
  sec=Math.max(0,Math.ceil(sec));
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  if(h>0) return h+"時間"+(m>0?m+"分":"");
  if(m>0) return m+"分"+(s>0&&m<10?s+"秒":"");
  return s+"秒";
}
function toast(msg,ms,center){
  const box=document.getElementById(center?"toastsc":"toasts");
  const el=document.createElement("div");
  el.className="toast"; el.textContent=msg;
  box.appendChild(el);

function beep(freq,dur){
  if(state&&state.bgmMuted) return; /* 消音中は効果音も鳴らさない */
  try{
    const ctx=beep.ctx||(beep.ctx=new (window.AudioContext||window.webkitAudioContext)());
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.value=freq; o.type="triangle";
    g.gain.setValueAtTime(0.08,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+dur);
  }catch(e){}
}

/* ============ BGM（ループ再生・音量0.15） ============ */
/* 本番はHTTPSのためhttpsで参照（混在コンテンツ回避）。自動再生制限があるので初回操作で開始 */
const BGM_URL="https://tekuzo.org/wp-content/uploads/2026/07/Picket-Fence-Pantry.mp3";
const BGM_VOL=0.15;
let bgmEl=null, bgmOn=false;
function startBGM(){
  if(bgmOn) return;
  try{
    if(!bgmEl){ bgmEl=new Audio(BGM_URL); bgmEl.loop=true; bgmEl.preload="auto"; bgmEl.volume=BGM_VOL; }
    bgmEl.muted=!!(state&&state.bgmMuted); /* 保存された消音設定を反映 */
    const p=bgmEl.play();
    if(p&&p.then) p.then(()=>{ bgmOn=true; }).catch(()=>{}); /* 失敗時は次の操作で再挑戦 */
    else bgmOn=true;
  }catch(e){}
}
/* 消音のオン/オフ切替（畑画面の消音ボタン）。設定は保存され、ボタン表示も更新 */

/* ============ エフェクト ============ */
function flyEmoji(fromEl,glyph){
  const r=fromEl.getBoundingClientRect();
  /* 飛び先＝ヘッダーのカゴアイコン（カゴの行き先）。無ければうりばボタン/コイン表示に保険 */
  const targetEl=document.getElementById("basket")||document.querySelector('#nav button[data-id="sell"]')||document.getElementById("coins");
  const c=targetEl.getBoundingClientRect();
  const s=document.createElement("span");
  s.className="fly";
  if(/[<]/.test(glyph)) s.innerHTML=glyph; else s.textContent=glyph; /* 画像作物(<img>/SVG)は画像で飛ぶ */
  const x0=r.left+r.width/2-15, y0=r.top+r.height/2-15;
  s.style.left=x0+"px"; s.style.top=y0+"px";
  document.body.appendChild(s);
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{
    s.style.transform=`translate(${c.left+c.width/2-15-x0}px,${c.top+c.height/2-15-y0}px) scale(.35)`;
    s.style.opacity=".35";
  });});
  setTimeout(()=>s.remove(),720);
}

/* 複数収穫（ジャガイモ等）：個数ぶん作物がポポポンと順に飛び出す演出 */
/* glyph は cropGlyph(crop) の戻り値（画像作物は<img>・絵文字作物は絵文字）をそのまま入れる */
function popHarvest(fromEl,glyph,count){
  if(!fromEl) return;
  const r=fromEl.getBoundingClientRect();
  const cx=r.left+r.width/2-13, cy=r.top+r.height/2-13;
  const n=Math.max(1,count|0);
  for(let k=0;k<n;k++){
    setTimeout(()=>{
      const s=document.createElement("span");
      s.className="poppop"; s.innerHTML=glyph;
      s.style.left=cx+"px"; s.style.top=cy+"px";
      const spread=n===1?0:((k/(n-1))-0.5)*2; /* -1..1 に広げる */
      s.style.setProperty("--px",(spread*24).toFixed(1)+"px");
      document.body.appendChild(s);
      beep(660+k*90,0.05); /* ポ・ポ・ポン（音が上がる） */
      setTimeout(()=>s.remove(),640);
    }, k*95);
  }
}

function ensurePet(id){
  if(!petSim[id]) petSim[id]={id,x:15+Math.random()*65,toX:0,fromX:0,dir:1,state:"idle",until:0,moveStart:0,moveEnd:0,emote:null,emoteUntil:0};
  return petSim[id];
}
function petCurrentX(p,now){
  if(p.state!=="walk") return p.x;
  const f=Math.max(0,Math.min(1,(now-p.moveStart)/Math.max(1,p.moveEnd-p.moveStart)));
  return p.fromX+(p.toX-p.fromX)*f;
}
function applyPetClasses(p,el){
  const cls="pet pet-"+p.id
    +(p.state==="walk"?" walking":"")
    +(p.state==="sleep"?" sleeping":"")
    +((p.state==="sit"||p.state==="point"||p.state==="shelter")?" sitting":"")
    +(p.dir<0?" flip":"")
    +(p.emote?" emoting":"");
  if(el.className!==cls) el.className=cls;
}
function applyPetEmote(p,el){
  const pe=el.querySelector(".pemote");
  const txt=p.emote||"";
  if(pe&&pe.textContent!==txt) pe.textContent=txt;
}
/* ペット位置の基準となる親（left:%の基準＝offsetParentの内容幅） */
function petParentW(el){ const pp=el.offsetParent||el.parentElement; return pp?pp.clientWidth:480; }
/* 歩行を transform:translateX で animate（毎フレームのlayout/paintを避けGPU合成のみに）。
   静止位置は left:% のまま（自動リフロー・軽い）、歩き出しでleftを開始位置に固定しtransformで差分を動かす */
function walkDom(el,fromX,toX,ms){
  const dx=(toX-fromX)/100*petParentW(el);
  el.style.transition="none";
  el.style.left=fromX+"%";
  el.style.transform="translateX(0px)";
  el.style.willChange="transform";
  void el.offsetWidth; /* reflowで開始状態を確定 */
  el.style.transition=`transform ${ms}ms ease-in-out`;
  el.style.transform=`translateX(${dx}px)`;
}
/* 歩行終了・静止：transformを0に戻し left を最終位置に置く（合成レイヤーも解放） */
function restDom(el,xPct){
  el.style.transition="none";
  el.style.transform="translateX(0px)";
  el.style.left=xPct+"%";
  el.style.willChange="";
}
function startWalk(p,toX,fac){
  const now=Date.now();
  toX=Math.max(4,Math.min(92,toX));
  p.fromX=p.x=petCurrentX(p,now);
  p.toX=toX;
  p.dir=toX>=p.x?1:-1;
  const dur=Math.max(700,Math.abs(toX-p.x)/100*PET_CFG[p.id].speed*1000*(fac||1));
  p.moveStart=now; p.moveEnd=now+dur;
  p.state="walk"; p.until=p.moveEnd;
  const el=document.getElementById("pet-"+p.id);
  if(el){
    applyPetClasses(p,el);
    walkDom(el,p.fromX,toX,dur);
  }
}
function decidePet(p,now){
  const cfg=PET_CFG[p.id];
  const tod=todClass(), w=weatherNow().id;
  /* ふくろうは夜行性（昼に眠る）、ほかは夜に眠る */
  const sleepy=(p.id==="owl")?(tod!=="t-night"):(tod==="t-night");
  if(sleepy){
    if(Math.abs(p.x-cfg.sleepX)<5){ p.state="sleep"; p.until=now+9000; }
    else startWalk(p,cfg.sleepX+Math.random()*4-2);
    return;
  }
  /* 雨・雪：木の下に避難（ドラゴンとふくろうは平気） */
  if((w==="rain"||w==="snow")&&p.id!=="dragon"&&p.id!=="owl"){
    const spot=86;
    if(Math.abs(p.x-spot)<6){
      p.state="shelter"; p.until=now+6000;
      if(!p.emote){ p.emote=w==="snow"?"❄️":"☔"; p.emoteUntil=now+2000; }
    }else startWalk(p,spot+Math.random()*6-3);
    return;
  }
  /* 収穫できる作物の列に駆け寄って知らせる */
  const readyCols=[];
  for(let i=0;i<state.plotCount;i++){
    const pl=state.plots[i];
    if(pl.seed&&pl.progress>=1) readyCols.push(i%3);
  }
  if(readyCols.length&&Math.random()<0.3){
    const cx=[18,50,82][readyCols[Math.floor(Math.random()*readyCols.length)]];
    if(Math.abs(p.x-cx)<5){ p.state="point"; p.until=now+5000; }
    else startWalk(p,cx);
    return;
  }
  /* 気まぐれ：歩く・たたずむ・座る（ねこはたまにダッシュ） */
  const r=Math.random();
  if(r<0.55){
    const dash=((p.id==="cat"||p.id==="blackcat")&&Math.random()<0.2);
    startWalk(p,6+Math.random()*86,dash?0.35:1);
    if(dash){ p.emote="💨"; p.emoteUntil=now+900; }
  }else if(r<0.8){ p.state="idle"; p.until=now+1500+Math.random()*3000; }
  else{ p.state="sit"; p.until=now+3000+Math.random()*4000; }
}
function petTick(){
  const now=Date.now();
  for(const pd of PETS){
    if(!hasPet(pd.id)) continue;
    const p=ensurePet(pd.id);
    if(p.state==="walk"){
      if(now>=p.moveEnd){
        p.x=p.toX; p.state="idle"; p.until=now+300;
        const el=document.getElementById("pet-"+p.id);
        if(el) restDom(el,p.x);
      }
    }else if(now>=p.until){
      decidePet(p,now);
    }
    if(p.emote&&now>p.emoteUntil) p.emote=null;
    if(p.state==="sleep"){ p.emote="💤"; p.emoteUntil=now+2000; }
    else if(p.state==="point"){ p.emote="❗"; p.emoteUntil=now+2000; }
    else if(!p.emote&&(p.state==="idle"||p.state==="walk")&&Math.random()<0.04){
      p.emote=["♪","❤️","❓"][Math.floor(Math.random()*3)];
      p.emoteUntil=now+1700;
    }
    const el=document.getElementById("pet-"+pd.id);
    if(el){ applyPetClasses(p,el); applyPetEmote(p,el); }
  }
}

function harvestPlot(i,collector){
  const p=state.plots[i];
  const crop=cropOf(p.seed);
  const mutId=p.mut||"normal";
  const mut=mutOf(mutId);
  /* 1株から複数収穫できる作物（ジャガイモ=2〜4）。変異は株ごと同じで個数ぶんカゴへ */
  const count=crop.yld?crop.yld[0]+Math.floor(Math.random()*(crop.yld[1]-crop.yld[0]+1)):1;
  state.totalHarvests+=count;
  const key=crop.id+":"+mutId;
  const isNew=!state.dex[key];
  state.dex[key]=(state.dex[key]||0)+count;
  invAdd(key,count);
  if(isGiant(mutId)){
    const arr=(state.invG[key]=state.invG[key]||[]);
    for(let k=0;k<count;k++) arr.push(p.gsize||1.5);
  }
  fgOnce("firstHarvest","fushigi_first_harvest",{crop_id:crop.id}); /* ★初回収穫 */
  if(colorOf(mutId)==="rainbow") fgEvent("fushigi_rainbow_crop",{crop_id:crop.id,mut_type:mutId}); /* 虹色作物を収穫 */
  fgCheckDex(); /* 図鑑マイルストーン/コンプ */
  p.seed=null; p.progress=0; p.mut="normal"; p.readyAt=0; p.struck=false; p.boosts=keepWet(p.boosts);
  collector.push({crop,mut,isNew,key,count});
}

/* idx日目の報酬。0-2=既存オンボ、3以降=5日周期のスプリンクラー配布 */
function loginReward(idx){
  if(idx<LOGIN_REWARDS.length) return LOGIN_REWARDS[idx];
  const pos=(idx-LOGIN_REWARDS.length)%5; /* 0..4 = ＋1..＋5 */
  if(pos===0) return {spr:1,             label:`${SPR} スプリンクラー ×1`, teaser:`${SPR} スプリンクラー`};
  if(pos===1) return {goldRnd:true,      label:"✨ 金作物の種 ×1",     teaser:"✨ 金作物の種"};
  if(pos===2) return {spr:1,             label:`${SPR} スプリンクラー ×1`, teaser:`${SPR} スプリンクラー`};
  if(pos===3) return {spr:2, coins:500,  label:`${SPR} スプリンクラー ×2<br>🪙 500コイン`, teaser:`${SPR}×2 ＋ 🪙500`};
  return       {spr:1, giantRnd:true, label:`${SPR} スプリンクラー ×1<br>🌟 巨大作物の種 ×1`, teaser:`${SPR} ＋ 🌟 巨大作物の種`};
}

/* 虹色作物のきらめき：金寄りSVG粒子×3（白い光彩はCSSの::before/.tglowで瞬かせる） */
const RB_SPARK_PATH="M16 1 C 17.6 11, 21 14.4, 31 16 C 21 17.6, 17.6 21, 16 31 C 14.4 21, 11 17.6, 1 16 C 11 14.4, 14.4 11, 16 1 Z";
/* グローはCSSフィルタを使わずSVG内に焼き込む（背面に淡い金の星＋手前に白い芯）→ drop-shadow不要で再ラスタライズ無し */
function rbSparkSVG(base,slots){ return (slots||["s1","s2","s3"]).map(s=>`<svg class="${base} ${s}" viewBox="0 0 32 32"><path transform="translate(16 16) scale(1.5) translate(-16 -16)" d="${RB_SPARK_PATH}" fill="#ffcf6b" opacity=".4"/><path d="${RB_SPARK_PATH}" fill="#fff6da"/></svg>`).join(""); }
const RB_PLOT_FX=rbSparkSVG("rbspark");
/* 飾ったときは粒子を右上(s1)・左下(s2)の2つだけに */
const RB_TROPHY_FX=`<i class="tglow"></i>`+rbSparkSVG("tspark",["s1","s2"]);
 
/* 虹色は色相回転（filter）を内側spanに分離する。外側spanは揺れ/跳ね（transform）専任 */
const hueWrap=(glyph,color)=>color==="rainbow"?`<span class="hue">${glyph}</span>`:glyph;
function plotContent(i,needHtml){
  if(needHtml===undefined) needHtml=true;
  const p=state.plots[i];
  if(!p.seed){
    return {sig:"empty", cls:"plot empty",
      html:needHtml?`<div class="pemoji"><span>＋</span></div><div class="pname">うえる</div><div class="ptime">&nbsp;</div>`:undefined};
  }
  const crop=cropOf(p.seed);
  const mutId=p.mut||"normal";
  const mut=mutOf(mutId);
  const color=colorOf(mutId), giant=isGiant(mutId);
  const mcls=(color!=="normal"?" m-"+color:"")+(giant?" m-giant":"");
  const gsize=giant?Math.round(58*(p.gsize||1.5)):0;
  const gstyle=giant?` style="font-size:${gsize}px"`:"";
  const nm=mutCropName(mut,crop.name);
  const fertBadges=FERTS.filter(f=>p.boosts&&p.boosts[f.axis]).map(f=>f.badge).join("");
  const wet=plotWet(p);
  const fertBadge=(fertBadges?`<i class="fertbadge">${fertBadges}</i>`:"")+(wet?`<i class="wetbadge">${SPR}</i>`:"");
  const fertSig=(fertBadges?":"+fertBadges:"")+(wet?":w":"");
  /* パイナップルだけ畑での実アイコンを1.5倍に */
  const cropScale=ICON_SCALE[crop.id]?`font-size:${ICON_SCALE[crop.id]}em;`:"";
  const prog=Math.min(1,p.progress);
  if(prog>=1){
    const inWin=p.readyAt&&Date.now()<p.readyAt+MUT_WINDOW*1000;
    const shW=giant?Math.round(gsize*0.55):26;
    const shH=giant?9:7;
    return {sig:p.seed+":3:"+mutId+":"+gsize+(inWin?":w":"")+fertSig, cls:"plot ready"+mcls,
      html:needHtml?`${fertBadge}<i class="glowring"></i>${color==="rainbow"?RB_PLOT_FX:""}<div class="pemoji"${gstyle}><i class="cshadow" style="width:${shW}px;height:${shH}px"></i><span class="bounce" style="${cropScale}">${hueWrap(cropGlyph(crop),color)}</span></div><div class="pname">${nm}</div><div class="bar"><i style="width:100%"></i></div><div class="ptime">${inWin?"タップで収穫！✨":"タップで収穫！"}</div>`:undefined};
  }
  const ring=(color==="rainbow")?`<i class="glowring"></i>`:"";
  const stIdx=prog<0.3?0:prog<0.6?1:prog<0.8?2:3;
  const stage=stIdx===0?"🌱":stIdx===1?"🌿":cropGlyph(crop);
  const tiny=(stIdx===0&&prog<0.1); /* 0〜10%は芽をさらに小さく（60%） */
  const leafSize=stIdx===1?(prog<0.45?0.95:1.05):null; /* 30〜45%は葉95%・45〜60%は葉105% */
  const dimF=(mutId==="normal"&&stIdx===2)?"filter:grayscale(.5) opacity(.75) drop-shadow(0 4px 3px rgba(0,0,0,.55));"
            :(mutId==="normal"&&stIdx===3)?"filter:grayscale(.2) opacity(.87) drop-shadow(0 4px 3px rgba(0,0,0,.55));":"";
  /* ステップ2（60〜80%）は作物アイコンを70%サイズに（ステップ3で通常サイズ）／0〜10%の芽は60%・30〜45%の葉は95%・45〜60%は105% */
  const dim=dimF+(stIdx>=2?`font-size:${+(iconScaleOf(crop.id)*(stIdx===2?0.7:1)).toFixed(3)}em;`:(tiny?"font-size:0.6em;":leafSize!=null?`font-size:${leafSize}em;`:""));
  const barW=Math.floor(prog*100)+"%";
  /* 残り時間は天候ボーナス（雨×2）を除いたペット補正のみで見積もる。
     雨は一時的なので含めると雨終了時に表示が逆戻りして見えるため。 */
  const remainSec=crop.time*(1-prog)/growthMult(false);
  const timeText=remainSec<60?"あと1分未満":"あと "+fmtMin(remainSec);
  return {sig:p.seed+":"+stIdx+(tiny?"t":"")+(leafSize!=null?leafSize:"")+":"+mutId+":"+gsize+fertSig, cls:"plot"+mcls, barW, timeText,
    html:needHtml?`${fertBadge}${ring}${color==="rainbow"?RB_PLOT_FX:""}<div class="pemoji"${gstyle}><span class="grow sway" style="${dim}">${hueWrap(stage,color)}</span></div><div class="pname">${nm}</div><div class="bar"><i style="width:${barW}"></i></div><div class="ptime">${timeText}</div>`:undefined};
}

  }).join("");
  const trophies=state.display.map((d,k)=>{
    const tfx=(colorOf(d.mut)!=="normal"?" fx-"+colorOf(d.mut):"")+(isGiant(d.mut)?" fx-giant":"");
    const dispMul=1.2; /* 飾った作物は全体的に1.2倍 */
    const giantMul=isGiant(d.mut)?1.2:1; /* 飾った巨大作物はさらに1.2倍 */
    const cropMul=iconScaleOf(d.crop); /* 畑と同じ作物別倍率（パイナップル1.5・メロン1.3） */
    const baseFont=isGiant(d.mut)?30*(d.gsize||1.5):25;
    const tsize=`font-size:${Math.round(baseFont*cropMul*dispMul*giantMul)}px`;
    const shW=Math.round((isGiant(d.mut)?30*(d.gsize||1.5)*0.7:22)*cropMul*dispMul*giantMul);
    const rbfx=colorOf(d.mut)==="rainbow"?RB_TROPHY_FX:"";
    const tcrop=cropOf(d.crop);
    const tglyph=(d.emojiView&&CROP_SVG[tcrop.id]&&tcrop.e)?tcrop.e:cropGlyph(tcrop); /* 画像作物は飾りタップで絵文字に切替（絵文字がない作物は画像のまま） */
    return `<span class="trophywrap${isGiant(d.mut)?" giant":""}" style="left:${20+k*17}%"><i class="trophyshadow" style="width:${shW}px"></i>${rbfx}<span class="trophy${tfx}" data-act="trophy" data-k="${k}" style="${tsize}">${tglyph}</span></span>`;
  }).join("");
  html+=`<div class="field"><div class="fence"></div>
    <div class="yard">

      <span class="deco" style="left:44px;font-size:15px;bottom:2px">🌼</span>
      <span class="deco" style="right:4px;font-size:28px">🌲</span>
      <span class="deco" style="right:44px;font-size:14px;bottom:2px">🪨</span>
      ${((state.tools&&state.tools.scarecrow)||0)>0?`<img class="hcscare" src="${SCARECROW_IMG}" alt="カカシ" title="カカシがはたけを見張っている" data-act="scarecrowInfo">`:""}
      ${trophies}
      ${walkers}
    </div><div class="grid">`;
  for(let i=0;i<state.plotCount;i++){
    const c=plotContent(i);
    html+=`<div class="${c.cls}" data-act="plot" data-i="${i}" data-sig="${c.sig}">${c.html}</div>`;
  }
  if(state.plotCount<MAX_PLOTS){
    const cost=PLOT_COSTS[state.plotCount];
    html+=`<div class="plot buy" data-act="buyPlot"><div class="pemoji">🪏</div><div class="pname">畑をふやす</div><div class="ptime">🪙 ${fmt(cost)}</div></div>`;
  }
  html+=`</div></div></div>`;
  return html;
}
 
function updateGardenLive(doBarFast,doBarSlow){
  const grid=document.querySelector(".grid");
  if(!grid){ render(); return; }
  for(let i=0;i<state.plotCount;i++){
    const el=grid.querySelector(`.plot[data-i="${i}"]`);
    if(!el){ render(); return; }
    const c=plotContent(i,false); /* まず軽量に sig/barW/timeText だけ算出 */
    if(el.dataset.sig!==c.sig){
      applyPlot(el,plotContent(i,true),true); /* sig変化時（段階/収穫可/変異等）は毎ティック反映 */
    }else if(c.barW){
      /* バー(＋残り時間)の更新周期：にんじんは5秒・それ以外は20秒（layout/paintを間引き） */
      const doBar=(state.plots[i].seed==="carrot")?doBarFast:doBarSlow;
      if(doBar){
        const b=el.querySelector(".bar i");
        if(b&&b.style.width!==c.barW) b.style.width=c.barW;
        const tm=el.querySelector(".ptime");
        if(tm&&tm.textContent!==c.timeText) tm.textContent=c.timeText;
      }
    }
  }
}
 
/* 案B：長時間放置の復帰後、畑マスのGPUレイヤーが破棄されたまま再描画されず
   背景が抜ける（下の緑の地面が透けて見える）ことがある。レイヤーを作り直して強制再描画する。
   一瞬 display を切ることで確実にリフローさせ、次フレームで戻す（見た目の副作用なし） */
function repaintGarden(){
  if(tab!=="garden") return;
  const grid=document.querySelector(".grid");
  if(!grid) return;
  const prev=grid.style.display;
  grid.style.display="none";
  void grid.offsetHeight;      /* 強制リフロー（レイヤー再生成のトリガ） */
  grid.style.display=prev||"";
}
 
function renderTray(force){
  const tray=document.getElementById("tray");
  if(tab!=="garden"){ tray.style.display="none"; traySig=""; return; }
  tray.style.display="block";
  let ready=0;
  for(let i=0;i<state.plotCount;i++){ const p=state.plots[i]; if(p.seed&&p.progress>=1) ready++; }
  /* 入荷されている種だけ表示（入荷なし=stockLeft -1 は隠す。売り切れ0は表示） */
  const shown=CROPS.filter(c=>stockLeft(c.id)!==-1);
  /* 無料の種（ログインボーナス等） */
  const giftEntries=Object.keys(state.giftSeeds).filter(k=>state.giftSeeds[k]>0);
  /* 選択中の種が無効になったら、表示中の先頭に切り替える */
  if(state.selectedSeed && state.selectedSeed.indexOf("gift:")===0){
    if(!(state.giftSeeds[state.selectedSeed.slice(5)]>0) && shown.length) state.selectedSeed=shown[0].id;
  }else if(!shown.some(c=>c.id===state.selectedSeed) && shown.length){ state.selectedSeed=shown[0].id; }
  const sig=state.selectedSeed+"|"+(ready>=2?ready:0)+"|"+curPeriod()+"|"
    +CROPS.map(c=>(state.coins>=c.cost?1:0)+":"+stockLeft(c.id)).join(",")
    +"|"+giftEntries.map(k=>k+state.giftSeeds[k]).join(",")
    +"|"+(selTool||"")+"|"+FERTS.map(f=>(fertVisible(f)?1:0)+":"+(state.coins>=f.cost?1:0)+":"+fertStockLeft(f.id)).join(",")
    +"|spr"+sprinklerCount();
  if(!force && sig===traySig) return;
  traySig=sig;
  const bar=document.getElementById("seedbar");
  const sx=bar?bar.scrollLeft:0;
  const giftChips=giftEntries.map(k=>{
    const cid=k.split(":")[0], gmut=k.split(":")[1], crop=cropOf(cid);
    if(!crop) return "";
    const sel=(!selTool&&state.selectedSeed==="gift:"+k)?" sel":"";
    const badge=gmut==="giant"?"🌟":gmut==="gold"?"✨":"";
    return `<div class="seedchip gift${sel}" data-act="seed" data-id="gift:${k}">
      <span class="se">🎁${cropGlyph(crop)}${badge}</span>${crop.name}<span class="sc">むりょう×${state.giftSeeds[k]}</span></div>`;
  }).join("");
  /* どうぐ（消耗品肥料）チップ。各肥料は初めてcost到達で入荷解禁。在庫は1入荷=1個。
     今期入荷していない肥料はチップ自体を出さない（入荷率<100%のグングン肥料など） */
  const toolChip=FERTS.filter(f=>fertVisible(f)&&fertStockedThisPeriod(f)).map(f=>{
    const sold=fertStockLeft(f.id)<=0;
    const sel=selTool===f.id?" sel":"";
    const poor=(!sold&&state.coins<f.cost)?" poor":"";
    return `<div class="seedchip tool${sel}${sold?" sold":poor}" data-act="tool" data-id="${f.id}">
      <span class="se">${f.e}</span>${f.name}<span class="sc">${sold?"うりきれ":"🪙"+fmt(f.cost)}</span></div>`;
  }).join("");
  /* スプリンクラー（ログボ配布・在庫があるときだけ表示） */
  const sprChip = sprinklerCount()>0
    ? `<div class="seedchip tool${selTool==="sprinkler"?" sel":""}" data-act="tool" data-id="sprinkler"><span class="se">${SPR}</span>スプリンクラー<span class="sc">×${sprinklerCount()}</span></div>`
    : "";
  tray.innerHTML=(ready>=2?`<button class="hallbtn" data-act="harvestAll">🧺 まとめて収穫（${ready}個）</button>`:"")
    +`<div class="seedbar" id="seedbar">`+giftChips+shown.map(c=>{
      const left=stockLeft(c.id);
      const sel=(!selTool&&state.selectedSeed===c.id)?" sel":"";
      const rare=RARE_IDS.includes(c.id)&&left>0?" rare":"";
      const scls=left===0?" sold":"";
      const poor=(left>0&&state.coins<c.cost)?" poor":"";
      /* 画像/SVGアイコンの作物（サツマイモ等）は種チップにもチップ用倍率を適用（絵文字は等倍のまま）。
         .se は固定px基準（--se-base）なので calc で倍率をかける。畑/展示とは別値（CHIP_SCALE）にできる。
         高さは .se 共通の固定枠＋flex中央なので端末差なく他チップと縦位置が揃う */
      const seScale=CHIP_SCALE[c.id]!==undefined?` style="font-size:calc(var(--se-base)*${CHIP_SCALE[c.id]})"`:"";
      return `<div class="seedchip${sel}${poor}${scls}${rare}" data-act="seed" data-id="${c.id}">
        <span class="se"${seScale}>${cropGlyph(c)}</span>${c.name}<span class="sc">🪙${fmt(c.cost)}</span></div>`;
    }).join("")
    +toolChip+sprChip
    +`<div class="traysep"></div>`
    +`<div class="restocklabel"><span class="se">🛒</span><span class="rl-cap">つぎの入荷</span><span class="rl-time" id="rsleft">${fmtMin(restockRemainSec())}</span></div>`
    +`</div>`;
  const b2=document.getElementById("seedbar");
  if(b2) b2.scrollLeft=sx;
}
 
function renderSell(){

    </div>`;
  }
  html+=`<h2>🏆 展示だな（売値+5%/個）</h2>`;
  if(!state.display.length) html+=`<div class="emptymsg">レアをかざると売値アップ</div>`;
  state.display.forEach((d,k)=>{
    const c=cropOf(d.crop), m=mutOf(d.mut);
    const dfx=(colorOf(m.id)!=="normal"?" fx-"+colorOf(m.id):"")+(isGiant(m.id)?" fx-giant":"");
    const giant=isGiant(m.id);
    const dsize=giant?` style="font-size:${Math.min(58,Math.round(28*(d.gsize||1.5)+6))}px"`:"";
    const sizeNote=giant?` ${(d.gsize||1.5).toFixed(1)}倍`:"";
    const bragText=`${m.badge} ふしぎ植物園で「${mutCropName(m,c.name)}${sizeNote}」をかざってる！🏆🌱`;
    html+=`<div class="card"><div class="ce${dfx}"${dsize}>${cropGlyph(c)}</div>
      <div class="cb"><div class="cn">${mutCropName(m,c.name)}${sizeNote}</div></div>
      <div class="dispbtns">
        <button class="sbtn brag" data-act="share" data-src="display" data-text="${bragText.replace(/"/g,"&quot;")}"><span class="bi">📣</span><span class="bl">自慢</span></button>
        <button class="sbtn" data-act="undisplay" data-k="${k}"><span class="bi">🧺</span><span class="bl">もどす</span></button>
      </div></div>`;
  });
  return html;
}
 
function renderPets(){
  let html=`<h2>🐾 ペット</h2>`;
  html+=PETS.map(p=>{
    const owned=hasPet(p.id);
    const napping = p.id==="dog" && state.dogOff;
    const ownedHtml = (p.id==="dog")
      ? `<button class="dogtoggle${state.dogOff?" off":""}" data-act="toggleDog">${state.dogOff?"オフ":"オン"}</button>`
      : `<span class="owned">✅ なかま</span>`;
    const ceHtml = napping
      ? `<div class="ce doghouse"><span class="dh-house">🏠</span><span class="dh-dog">🐶</span></div>`
      : `<div class="ce">${p.e}</div>`;
    const descHtml = p.desc;
    return `<div class="card${napping?" napping":""}">${ceHtml}
      <div class="cb"><div class="cn">${p.name}</div><div class="cd">${descHtml}</div></div>
      ${owned?ownedHtml
        :`<button class="buybtn" data-act="buyPet" data-id="${p.id}" ${state.coins<p.cost?"disabled":""}>🪙 ${fmt(p.cost)}</button>`}
    </div>`;
  }).join("");
  /* ホームセンター（道具ショップ。初めて所持コイン800超で解禁）。
     スタック/耐久は在庫共有・上限あり、買い切りは所持フラグ */
  if(state.hcUnlocked){
  html+=`<h2>🏪 ホームセンター</h2>`;
  html+=GEARS.map(g=>{
    const t=state.tools||{};
    let statusHtml, btn;
    if(g.kind==="once"){
      const owned=!!t[g.id];
      /* 改造できる道具（ハサミ・VIPカード）は3段階：未所持=購入／所持=改造（⏫。カカシの修理🔧と区別する）／改造ずみ=あり */
      const canUpgrade=upReady(g.id);
      const done=UPGRADES[g.id] ? upDone(g.id) : owned;
      const cost=gearCost(g);
      statusHtml=""; /* 名前横の「所持」はボタンと重複するため出さない */
      btn=done
        ? `<span class="owned">✅ あり</span>` /* ペットの「✅ なかま」と同じ表示スタイル */
        : `<button class="buybtn" data-act="buyGear" data-id="${g.id}" ${state.coins<cost?"disabled":""}>${canUpgrade?'<span class="upic">⏫</span>':""}🪙 ${fmt(cost)}</button>`;
    }else if(g.single){ /* 単体設置（カカシ）：満タンは「✅ あり」、耐久がへっていれば修理（価格は耐久で変動） */
      const cur=t[g.id]||0, full=cur>=g.cap;
      const cost=gearCost(g), repair=cur>0; /* 耐久残あり＝修理 */
      statusHtml=""; /* 名前横の表示はボタンと重複するため出さない */
      btn=full
        ? `<span class="owned">✅ あり</span>` /* ペットの「✅ なかま」と同じ表示スタイル */
        : `<button class="buybtn" data-act="buyGear" data-id="${g.id}" ${state.coins<cost?"disabled":""}>${repair?"🔧":"🪙"} ${fmt(cost)}</button>`;
    }else{
      const cnt=t[g.id]||0, full=cnt>=g.cap;
      const boughtToday=g.daily && state.gearBuyDate && state.gearBuyDate[g.id]===todayStrJST();
      statusHtml=`<span class="owned" style="margin-left:6px">✕1</span>`; /* 所持数でなく1回で買える数（常に✕1） */
      btn=full
        ? `<button class="buybtn" disabled>×${g.cap} いっぱい</button>`
        : boughtToday
          ? `<button class="buybtn" disabled>うりきれ</button>`
          : `<button class="buybtn" data-act="buyGear" data-id="${g.id}" ${state.coins<g.cost?"disabled":""}>🪙 ${fmt(g.cost)}</button>`;
    }
    /* 改造ずみは名前・アイコン・説明を上位版に差し替え、改造前の所持中は改造をうながす説明にする */
    const up=UPGRADES[g.id], upOn=upDone(g.id);
    const ceHtml = g.id==="scarecrow"
      ? `<span class="scarebust" style="background-image:url(${SCARECROW_IMG})"></span>` /* 畑のカカシ画像のバストアップ */
      : upOn ? up.e : g.e;
    const descHtml = g.id==="scarecrow"
      ? `カラスからはたけを守る（現在 ${(t[g.id]||0)} / ${g.cap}）` /* 耐久の現在値を表示 */
      : upOn ? up.desc
      : upReady(g.id) ? up.owned
      : g.desc;
    const nameHtml = upOn ? up.name : g.name;
    return `<div class="card"><div class="ce">${ceHtml}</div>
      <div class="cb"><div class="cn">${nameHtml}${statusHtml}</div><div class="cd">${descHtml}</div></div>
      ${btn}
    </div>`;
  }).join("");
  }
  return html;
}
