/* ============ 操作 ============ */
document.body.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(!t) return;
  const act=t.dataset.act;
 
  if(act==="tab"){ tab=t.dataset.id; render(); return; }
 
  if(act==="tool"){
    if(t.dataset.id==="sprinkler"){
      if(sprinklerCount()<=0){ toast("🚿 スプリンクラーがないよ",2200,true); return; }
      selTool = selTool==="sprinkler" ? null : "sprinkler";
      renderTray(true);
      if(selTool) toast("🚿 育てている作物をタップ（1時間 成長×2）",3600,true);
      return;
    }
    const f=FERT_BY_ID.get(t.dataset.id); if(!f) return;
    if(fertStockLeft(f.id)<=0){ toast(`📦 入荷をまとう！`,2200,true); return; }
    if(state.coins<f.cost){ toast(`🪙 コインが足りない！`,2200,true); return; }
    selTool = selTool===f.id ? null : f.id;
    renderTray(true);
    if(selTool) toast(f.desc,3800,true);
    return;
  }
 
  if(act==="seed"){
    const id=t.dataset.id;
    selTool=null;
    state.selectedSeed=id; renderTray(true); save();
    if(id.indexOf("gift:")===0){ toast("🎁 むりょうの種！空き畑をタップで植えよう",2200,true); return; }
    /* 買えない種をタップしたら理由を表示 */
    const crop=cropOf(id), left=stockLeft(id);
    if(left===0||left===-1) toast(`📦 入荷をまとう！`,2200,true);
    else if(state.coins<crop.cost) toast(`🪙 コインが足りない！`,2200,true);
    return;
  }
 
  if(act==="plot"){
    const i=+t.dataset.i, p=state.plots[i];
    /* スプリンクラーを選択中：育成中の作物にまく（土に1時間しめり） */
    if(selTool==="sprinkler"){
      if(sprinklerCount()<=0){ toast("🚿 スプリンクラーがないよ",2200,true); selTool=null; renderTray(true); return; }
      if(isBonusWx(weatherNow().id)){ toast("🚿 雨/雪の間は使えないよ",2600,true); return; }
      if(!p.seed){ toast("🚿 作物につかおう",2200,true); return; }
      if(p.progress>=1){ toast("🚿 育成中の作物につかおう",2200,true); return; }
      if(plotWet(p)){ toast("🚿 このマスはつかえないよ",2200,true); return; }
      showSprinklerConfirm(i);
      return;
    }
    /* どうぐ（肥料）を選択中：育成中の作物にまく */
    if(selTool && FERT_BY_ID.has(selTool)){
      const f=FERT_BY_ID.get(selTool);
      if(!p.seed){ toast(`${f.e} 育てている作物にまこう`,2200,true); return; }
      if(p.progress>=1){ toast(`${f.e} 収穫前の育成中の作物にまこう`,2200,true); return; }
      if(plotHasFert(p)){ toast(`${f.e} もう肥料がまかれているよ`,2200,true); return; }
      if(fertStockLeft(f.id)<=0){ toast(`📦 ${f.name}は うりきれ\nつぎの入荷まで`,2400,true); selTool=null; renderTray(true); return; }
      if(state.coins<f.cost){ toast(`🪙 コインが足りない！（${f.name}：${fmt(f.cost)}）`); return; }
      showFertConfirm(i, f.id);
      return;
    }
    if(!p.seed){
      /* 無料の種（ログインボーナス等）を選択中なら、コインなしで植える */
      if(state.selectedSeed && state.selectedSeed.indexOf("gift:")===0){
        const gk=state.selectedSeed.slice(5);
        if(!(state.giftSeeds[gk]>0)){ toast("🎁 むりょうの種がもうないよ",2200,true); return; }
        const cid=gk.split(":")[0], gmut=gk.split(":")[1];
        state.giftSeeds[gk]--; if(state.giftSeeds[gk]<=0) delete state.giftSeeds[gk];
        p.seed=cid; p.progress=0; p.readyAt=0; p.struck=false; p.boosts=keepWet(p.boosts);
        if(gmut==="giant"){ p.mut="giant"; p.gsize=1+Math.random(); }
        else if(gmut==="gold"){ p.mut="gold"; }
        else { p.mut="normal"; }
        fgOnce("firstPlant","fushigi_first_plant",{crop_id:cid}); /* ★初回植え付け */
        beep(520,0.1); haptic(20);
        patchPlot(i); renderHeader(); renderTray(true); save();
        return;
      }
      const crop=cropOf(state.selectedSeed);
      const left=stockLeft(crop.id);
      if(left===-1){ toast(`📦 ${crop.name}は入荷をまとう！`,2200,true); return; }
      if(left===0){ toast(`📦 ${crop.name}はうりきれ 入荷をまとう！`,2200,true); return; }
      if(state.coins<crop.cost){ toast(`🪙 コインが足りない！（${crop.name}の種：${fmt(crop.cost)}）`); return; }
      state.coins-=crop.cost;
      state.shopBought[crop.id]=(state.shopBought[crop.id]||0)+1;
      p.seed=crop.id; p.progress=0; p.mut="normal"; p.readyAt=0; p.struck=false; p.boosts=keepWet(p.boosts);
      fgOnce("firstPlant","fushigi_first_plant",{crop_id:crop.id}); /* ★初回植え付け */
      beep(520,0.1); haptic(20); /* 植えた手応え */
      if(stockLeft(crop.id)===0) toast(`📦 ${crop.name}の種、うりきれ`,2200,true);
      patchPlot(i); renderHeader(); renderTray(true); save();
    }else if(p.progress>=1){
      const crop=cropOf(p.seed);
      const results=[];
      harvestPlot(i,results);
      const r=results[0];
      flyEmoji(t,cropGlyph(crop));
      burst(t,r.mut.id!=="normal");
      floatText(t,"🧺 +"+r.count);
      if(r.count>1) popHarvest(t,cropGlyph(crop),r.count); /* 複数収穫はポポポン演出（画像作物は画像で） */
      haptic(r.mut.id!=="normal"?[15,40,30]:25); /* 収穫の手応え（変異は強め） */
      showHarvestResults(results);
      patchPlot(i); renderHeader(); renderTray(true); save();
    }else{
      const crop=cropOf(p.seed);
      /* toastはtextContentなので画像を出せない。絵文字を持たない作物は名前だけ */
      toast(`${crop.e?crop.e+" ":""}${crop.name}：あと ${fmtTime(crop.time*(1-p.progress)/growthMult(false))}`);
    }
    return;
  }
 
  if(act==="harvestAll"){
    /* 誤タップ防止のため、実収穫はボタンの3秒長押しのみ（pointer長押しハンドラで発火）。タップ時はヒント */
    toast("🧺 ボタンを長押し！",2200,true);
    return;
  }
 
  if(act==="buyPlot"){
    const cost=PLOT_COSTS[state.plotCount];
    if(state.coins<cost){ toast(`🪙 コインが足りない！（畑の拡張：${fmt(cost)}）`); return; }
    showBuyPlotConfirm(cost);
    return;
  }
 
  if(act==="buyPlotDo"){
    document.getElementById("overlay").classList.remove("show");
    const cost=PLOT_COSTS[state.plotCount];
    if(state.coins<cost){ toast(`🪙 コインが足りない！（畑の拡張：${fmt(cost)}）`); return; }
    state.coins-=cost; state.plotCount++;
    fgEvent("fushigi_field_expand",{plot_count:state.plotCount}); /* 畑拡張 */
    beep(700,0.15);
    toast("🟫 畑が広がった！");
    render(); save(); return;
  }
 
  if(act==="fertDo"){
    document.getElementById("overlay").classList.remove("show");
    const i=+t.dataset.i, p=state.plots[i];
    const f=FERT_BY_ID.get(t.dataset.fid); if(!f) return;
    if(!p||!p.seed||p.progress>=1){ toast(`${f.e} いまはまけないみたい`); return; }
    if(plotHasFert(p)){ toast(`${f.e} もう肥料がまかれているよ`,2200,true); return; }
    if(fertStockLeft(f.id)<=0){ toast(`📦 ${f.name}は うりきれ`,2200,true); return; }
    if(state.coins<f.cost){ toast(`🪙 コインが足りない！（${f.name}：${fmt(f.cost)}）`); return; }
    state.coins-=f.cost;
    state.shopBought[f.id]=(state.shopBought[f.id]||0)+1; /* 在庫を1消費 */
    p.boosts={...(keepWet(p.boosts)||{}), [f.axis]:f.mult(p.seed)}; /* 1マス1肥料。スプリンクラーのwetは維持（併用可） */
    beep(1040,0.14); setTimeout(()=>beep(1320,0.12),90); haptic([12,30,12]);
    const el=document.querySelector(`.grid .plot[data-i="${i}"]`);
    if(el){ burst(el,true); floatText(el,`${f.e}肥料`); }
    toast(`${f.e}${f.name}\nまいた！`,2600,true);
    selTool=null;
    patchPlot(i); renderHeader(); renderTray(true); save();
    return;
  }
 
  if(act==="sprinklerDo"){
    document.getElementById("overlay").classList.remove("show");
    const i=+t.dataset.i, p=state.plots[i];
    if(!p||!p.seed||p.progress>=1){ toast("🚿 いまはつかえないみたい"); return; }
    if(sprinklerCount()<=0){ toast("🚿 スプリンクラーがないよ",2200,true); return; }
    if(isBonusWx(weatherNow().id)){ toast("🚿 雨/雪の間は使えないよ",2600,true); return; }
    if(plotWet(p)){ toast("🚿 このマスはつかえないよ",2200,true); return; }
    state.tools.sprinkler=Math.max(0,state.tools.sprinkler-1);
    p.boosts={...(p.boosts||{}), wetUntil:Date.now()+SPRINKLER_MS};
    beep(680,0.14); setTimeout(()=>beep(920,0.12),90); haptic([12,30,12]);
    const el=document.querySelector(`.grid .plot[data-i="${i}"]`);
    if(el){ burst(el,false); floatText(el,"🚿"); }
    toast("🚿 スプリンクラー！1時間 成長×2",2600,true);
    selTool=null;
    patchPlot(i); renderTray(true); save();
    return;
  }
 
  if(act==="claimLogin"){
    document.getElementById("overlay").classList.remove("show");
    const idx=state.login.dayIndex;
    if(state.login.lastClaimDate!==todayStrJST()){
      grantLoginReward(idx);
      /* ★ログインボーナス（day=通算日、phase=オンボ/周期、cycle_day=周期内の位置） */
      fgEvent("fushigi_login_bonus", idx<LOGIN_REWARDS.length
        ? {day:idx+1, phase:"onboard", cycle_day:idx+1}
        : {day:idx+1, phase:"cycle", cycle_day:((idx-LOGIN_REWARDS.length)%5)+1});
      state.login.dayIndex=idx+1;
      state.login.lastClaimDate=todayStrJST();
      beep(880,0.2); setTimeout(()=>beep(1180,0.18),120); haptic([15,40,30]);
      toast("🎁 ログインボーナスをうけとった！",2600,true);
      render(); save();
    }
    return;
  }
 
  if(act==="buyPet"){
    const pet=PETS.find(p=>p.id===t.dataset.id);
    if(state.coins<pet.cost){ toast("🪙 コインが足りない！"); return; }
    state.coins-=pet.cost; state.pets[pet.id]=true;
    fgEvent("fushigi_pet_get",{pet_id:pet.id}); /* ペット入手 */
    beep(880,0.25);
    toast(`${pet.e} ${pet.name}がなかまになった！農場を歩いてるよ`);
    render(); save(); return;
  }
 
  if(act==="buyGear"){
    const g=GEARS.find(x=>x.id===t.dataset.id);
    if(!g) return;
    if(!state.tools) state.tools={sprinkler:0, scarecrow:0, sickle:false, sicklePlus:false, vip:false, vipPlus:false};
    if(!state.gearBuyDate) state.gearBuyDate={};
    if(g.daily && state.gearBuyDate[g.id]===todayStrJST()){ toast(`${g.e} ${g.name}は1日1個まで（またあした）`,2400,true); return; }
    /* 改造：本体を持っている状態で同じ行を押すと上位版になる（買い切り・ハサミ／VIPカード） */
    if(upReady(g.id)){
      const u=UPGRADES[g.id];
      if(state.coins<u.cost){ toast(`🪙 コインが足りない！（改造：${fmt(u.cost)}）`); return; }
      state.coins-=u.cost;
      state.tools[u.flag]=true;
      fgEvent("fushigi_gear_buy",{gear_id:g.id+"plus"}); /* 道具の改造（sickleplus / vipplus） */
      beep(680,0.14); setTimeout(()=>beep(920,0.12),90); setTimeout(()=>beep(1240,0.18),190); haptic([12,30,12,30,18]);
      showBanner(u.bt,u.bs,"shop");
      render(); save(); return;
    }
    if(g.kind==="once"){
      if(state.tools[g.id]){ toast(`${g.e} ${g.name}はもう持っている`,2000,true); return; }
    }else if(g.single){
      if((state.tools[g.id]||0)>=g.cap){ toast(`${g.e} ${g.name}はまだ元気！（耐久がへったら買えるよ）`,2400,true); return; }
    }else if((state.tools[g.id]||0)>=g.cap){
      toast(`${g.e} これいじょう持てない！（×${g.cap}）`,2200,true); return;
    }
    const cost=gearCost(g); /* カカシは耐久で変動 */
    if(state.coins<cost){ toast(`🪙 コインが足りない！（${g.name}：${fmt(cost)}）`); return; }
    const wasRepair=g.single && (state.tools[g.id]||0)>0; /* カカシ：耐久が残っている＝修理 */
    state.coins-=cost;
    if(g.single)              state.tools[g.id]=g.cap; /* 単体：買う/直すと耐久を満タンまで回復 */
    else if(g.kind==="stack")  state.tools[g.id]=Math.min(g.cap,(state.tools[g.id]||0)+1);
    else if(g.kind==="charge") state.tools[g.id]=Math.min(g.cap,(state.tools[g.id]||0)+(g.add||1));
    else if(g.kind==="once")  state.tools[g.id]=true;
    if(g.daily) state.gearBuyDate[g.id]=todayStrJST(); /* 1日1回制限の購入日を記録 */
    fgEvent("fushigi_gear_buy",{gear_id:g.id}); /* ホームセンターで道具購入 */
    beep(680,0.14); setTimeout(()=>beep(920,0.12),90); haptic([12,30,12]);
    if(g.single){
      toast(wasRepair?`🔧 ${g.name}をなおした！`:`${g.e} ${g.name}をおいた！`,2400,true);
    }else{
      const boughtAmt=g.kind==="stack"?1:(g.kind==="charge"?(g.add||1):0);
      const amt=boughtAmt?`（✕${boughtAmt}）`:"";
      toast(`${g.e} ${g.name}を買った！${amt}`,2400,true);
    }
    render(); save(); return;
  }
 
  if(act==="toggleDog"){
    state.dogOff=!state.dogOff;
    beep(state.dogOff?440:760,0.12);
    toast(state.dogOff?"🏠 いぬを小屋にいれた":"🐕 いぬが戻ってきた！",2400,true);
    render(); save(); return;
  }
 
  if(act==="muteBgm"){ toggleMute(); return; }
 
  if(act==="scarecrowInfo"){ /* はたけのカカシをタップ→耐久の現在値を表示 */
    const d=(state.tools&&state.tools.scarecrow)||0;
    toast(`🤷 カカシ（現在 ${d} / 3）`,2200,true);
    return;
  }
 
  if(act==="pet"){
    const pd=PETS.find(x=>x.id===t.dataset.id);
    if(!pd) return;
    const p=ensurePet(pd.id);
    if(p.state==="sleep"){ toast(`${pd.e} ${pd.name}はぐっすり眠っている…💤`); return; }
    p.emote="❤️"; p.emoteUntil=Date.now()+1600;
    applyPetClasses(p,t); applyPetEmote(p,t);
    t.classList.add("joy");
    setTimeout(()=>t.classList.remove("joy"),650);
    beep(1180,0.15);
    toast(`${pd.e} ${pd.name}：${pd.desc}`);
    return;
  }
 
  if(act==="sellStack"){
    const key=t.dataset.key;
    const n=state.inv[key]||0;
    if(!n) return;
    const [cid,mid]=key.split(":");
    const gs=t.dataset.gsize; /* 指定があればそのサイズ帯だけ売る */
    if(gs!==undefined && isGiant(mid)){
      const arr=giantSizesOf(key), keep=[]; let sold=0;
      for(const g of arr){ if(g.toFixed(1)===gs) sold++; else keep.push(g); }
      if(!sold) return;
      const v=unitValue(cropOf(cid),mutOf(mid))*sold;
      state.inv[key]=arr.length-sold;
      if(state.inv[key]<=0){ delete state.inv[key]; delete state.invG[key]; }
      else state.invG[key]=keep;
      state.coins+=v; state.totalEarned+=v;
      beep(760,0.18); toast(`💰 +${fmt(v)} コイン`);
      render(); save(); return;
    }
    const v=unitValue(cropOf(cid),mutOf(mid))*n;
    delete state.inv[key];
    delete state.invG[key];
    state.coins+=v; state.totalEarned+=v;
    beep(760,0.18);
    toast(`💰 +${fmt(v)} コイン`);
    render(); save(); return;
  }
 
  if(act==="sellEverything"){
    let v=0;
    for(const it of invList()) v+=unitValue(it.crop,it.mut)*it.count;
    if(!v) return;
    state.inv={};
    state.invG={};
    state.coins+=v; state.totalEarned+=v;
    beep(760,0.2); setTimeout(()=>beep(980,0.2),130);
    toast(`💰 ぜんぶ売った！ +${fmt(v)} コイン`);
    render(); save(); return;
  }
 
  if(act==="display"||act==="displayBest"){
    const key=t.dataset.key;
    if(state.display.length>=DISPLAY_MAX){ toast("🏆 展示だなはいっぱい！（うりばで整理しよう）"); return; }
    if(!(state.inv[key]>0)){ toast("カゴに入っていないみたい…"); return; }
    const [cid,mid]=key.split(":");
    const gs=t.dataset.gsize; /* 指定サイズ帯を飾る（うりばの行から） */
    let gsize=0;
    if(isGiant(mid)){
      const arr=giantSizesOf(key);
      let idx=(gs!==undefined)?arr.findIndex(g=>g.toFixed(1)===gs):-1;
      if(idx<0){ let mx=-1; arr.forEach((g,i)=>{ if(g>mx){ mx=g; idx=i; } }); } /* 未指定/不一致は最大個体 */
      gsize=arr[idx]!==undefined?arr[idx]:1.5;
      arr.splice(idx,1);
      state.inv[key]=arr.length;
      if(state.inv[key]<=0){ delete state.inv[key]; delete state.invG[key]; }
      else state.invG[key]=arr;
    }else{
      state.inv[key]--;
      if(!state.inv[key]) delete state.inv[key];
    }
    state.display.push({crop:cid,mut:mid,gsize});
    if(act==="displayBest") document.getElementById("overlay").classList.remove("show");
    beep(880,0.2);
    toast(`🏆 ${mutCropName(mutOf(mid),cropOf(cid).name)}をかざった！（売値+5%）`);
    render(); save(); return;
  }
 
  if(act==="trophy"){
    const k=+t.dataset.k, d=state.display[k];
    /* 画像作物（スイカ等）を飾っているとき：タップで画像↔絵文字を切替 */
    if(d && CROP_SVG[cropOf(d.crop).id]){
      d.emojiView=!d.emojiView; beep(720,0.08); render(); save(); return;
    }
    /* それ以外：カゴに戻さず、ブルっと震えるだけ */
    if(!t.classList.contains("shiver")){
      t.classList.add("shiver");
      beep(720,0.08);
      setTimeout(()=>t.classList.remove("shiver"),520);
    }
    return;
  }
 
  if(act==="undisplay"){
    const k=+t.dataset.k;
    const d=state.display[k];
    if(!d) return;
    state.display.splice(k,1);
    const dkey=d.crop+":"+d.mut;
    invAdd(dkey,1);
    if(isGiant(d.mut)){
      (state.invG[dkey]=state.invG[dkey]||[]).push(d.gsize||1.5);
    }
    toast("🧺 カゴにもどした");
    render(); save(); return;
  }
 
  if(act==="share"){
    fgEvent("fushigi_brag_share",{source:t.dataset.src||""}); /* ★自慢シェア（バイラル計測） */
    const text=t.dataset.text+" "+location.href;
    const isTouch=(matchMedia&&matchMedia("(pointer:coarse)").matches)||navigator.maxTouchPoints>0;
    if(isTouch) toast("LINEでおくろう",2600,true); /* スマホ：上下中央にヒント */
    if(navigator.share){ navigator.share({text}).catch(()=>{}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast("📋 コピーしました！SNSに貼ってね")).catch(()=>toast(text)); }
    else toast(text);
    return;
  }
 
  if(act==="closeModal"){
    document.getElementById("overlay").classList.remove("show");
    return;
  }
 
  if(act==="discardPlot"){
    const i=+t.dataset.i, p=state.plots[i];
    document.getElementById("overlay").classList.remove("show");
    if(p&&p.seed&&p.progress<1){
      p.seed=null; p.progress=0; p.mut="normal"; p.readyAt=0; p.struck=false; p.boosts=keepWet(p.boosts);
      beep(300,0.12); haptic([10,30,10]); /* 捨てた手応え */
      toast("🗑️ 作物をすてた");
      patchPlot(i); save();
    }
    return;
  }
 
  if(act==="startGame"){
    document.getElementById("title").classList.remove("show");
    beep(660,0.12); setTimeout(()=>beep(880,0.12),110);
    save(); /* 初回フラグ（セーブ）を確定させ、次回からタイトルを出さない */
    setTimeout(checkLoginBonus,500); /* 初回プレイヤー：タイトルを閉じた直後にDay1ボーナス */
    return;
  }
 
  if(act==="reset"){
    if(confirm("ほんとうに最初からやりなおす？（元に戻せません）")){
      localStorage.removeItem(SAVE_KEY);
      state=newState(); tab="garden"; render();
      document.getElementById("title").classList.add("show"); /* 初回と同じくタイトルへ戻す */
    }
    return;
  }
 
  if(act==="backupSave"){ doBackupSave(); return; }
  if(act==="backupLoad"){ doBackupLoad(); return; }
  if(act==="backupRestore"){
    document.getElementById("overlay").classList.remove("show");
    applyRestore();
    return;
  }
});
document.getElementById("overlay").addEventListener("click",e=>{
  if(e.target.id==="overlay") e.target.classList.remove("show");
});
 
/* デバッグ用：CTRL+ALT+C でコイン +10,000 */
document.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.altKey&&e.code==="KeyC"){
    e.preventDefault();
    state.coins+=10000;
    checkFertUnlock(false);
    beep(990,0.12); haptic(20);
    toast("🐞 デバッグ：コイン +10,000",1800,true);
    renderHeader(); renderTray(true); save();
  }
});
 
/* デバッグ用：CTRL+ALT+N で次の入荷に切り替え（期番号を1つ進める） */
document.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.altKey&&e.code==="KeyN"){
    e.preventDefault();
    debugPeriodOffset++;
    beep(990,0.12); haptic(20);
    toast("🐞 デバッグ：次の入荷に切替",1800,true);
    shopTick(); /* 期が変わったので在庫再生成＋入荷演出＋shopBoughtリセット */
  }
});
 
/* デバッグ用：CTRL+ALT+K でカラス飛来（オフライン復帰時の被害演出を強制発生。
   1日1回キャップと確率を一時解除して必中させ、init と同じ演出を再生する） */
document.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.altKey&&e.code==="KeyK"){
    e.preventDefault();
    if(tab!=="garden"){ tab="garden"; render(); }
    if(!state.crow) state.crow={lastDate:"",count:0};
    const savedDate=state.crow.lastDate, savedCount=state.crow.count;
    /* force必中で確率と1日の上限をスキップ。対象マスは関数内でランダム選択される */
    const victim=crowOfflineCheck(CROW_MAX_AWAY,null,true);
    state.crow.lastDate=savedDate; state.crow.count=savedCount; /* デバッグは実際の1日の回数に影響させない */
    if(!victim){ toast("🐞 カラス対象なし（成長中×通常作物×肥料/湿りなし が必要）",2800,true); return; }
    const cc=victim.crop;
    render(); save();
    if(victim.blocked){ /* カカシ所持時はブロック演出（トースト＋飛来） */
      setTimeout(()=>{
        crowFlyFX(); beep(330,0.12); setTimeout(()=>beep(440,0.12),190);
        toast("🐦‍⬛💦 カカシがカラスを追いはらった！",4000,true);
      },1200);
    }else{
      setTimeout(()=>showCrowModal(cc,()=>{ /* 通知を閉じた後にカラスが空を横切る＋盗まれたマスの影 */
        crowFlyFX(); beep(330,0.12); setTimeout(()=>beep(280,0.14),190);
        crowStolenFX(victim.idx,cc);
      }),1200);
    }
  }
});
 
/* 種トレイのドラッグスクロール（マウス用。タッチは touch-action:pan-x でネイティブ動作）と、
   成長中の作物の長押し廃棄を、1組の pointer リスナでまとめて処理する */
(function(){
  let bar=null, startX=0, startScroll=0, moved=false;           /* ドラッグ用 */
  let timer=null, sx=0, sy=0, fired=false; const LONG=500;       /* 畑長押し用 */
  let htimer=null, hbtn=null, hsx=0, hsy=0, hfired=false; /* まとめて収穫の長押し用（時間はハサミで短縮） */
  /* なし3秒／✂️ハサミ1.5秒／✂️いいハサミ（改造ずみ）1秒 */
  const holdMs=()=>upDone("sickle")?1000:(state.tools&&state.tools.sickle)?1500:3000;
  const clearLong=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  const clearHold=()=>{ if(htimer){ clearTimeout(htimer); htimer=null; } if(hbtn){ hbtn.classList.remove("holding"); hbtn=null; } };
  document.addEventListener("pointerdown",e=>{
    /* トレイのドラッグ開始（マウスのみ） */
    const b=e.target.closest(".seedbar");
    if(b&&e.pointerType==="mouse"){
      bar=b; moved=false; startX=e.clientX; startScroll=bar.scrollLeft; bar.classList.add("grabbing");
    }
    /* 成長中の畑セルの長押し開始 */
    fired=false;
    const pl=e.target.closest('.plot[data-act="plot"]');
    if(pl){
      const i=+pl.dataset.i, p=state.plots[i];
      if(p&&p.seed&&p.progress<1){
        sx=e.clientX; sy=e.clientY;
        timer=setTimeout(()=>{
          timer=null; fired=true;
          if(navigator.vibrate) navigator.vibrate(15);
          beep(440,0.06);
          showDiscardConfirm(i);
        },LONG);
      }
    }
    /* まとめて収穫ボタンの長押し開始（いいハサミ1秒／ハサミ1.5秒／なし3秒） */
    hfired=false;
    const hb=e.target.closest(".hallbtn");
    if(hb){
      const ms=holdMs();
      hb.style.setProperty("--holdms",ms+"ms"); /* ゲージの満ちる速さを長押し時間に同期 */
      hbtn=hb; hsx=e.clientX; hsy=e.clientY; hb.classList.add("holding");
      htimer=setTimeout(()=>{
        htimer=null; hfired=true;
        if(hbtn){ hbtn.classList.remove("holding"); hbtn=null; }
        if(navigator.vibrate) navigator.vibrate([15,40,30]);
        doHarvestAll();
      },ms);
    }
  });
  document.addEventListener("pointermove",e=>{
    if(bar){ const dx=e.clientX-startX; if(Math.abs(dx)>6) moved=true; if(moved) bar.scrollLeft=startScroll-dx; }
    if(timer&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)) clearLong();
    if(htimer){ const ov=document.elementFromPoint(e.clientX,e.clientY); if(!ov||!ov.closest(".hallbtn")) clearHold(); }
  });
  const end=()=>{ if(bar){ bar.classList.remove("grabbing"); bar=null; } clearLong(); clearHold(); };
  document.addEventListener("pointerup",end);
  document.addEventListener("pointercancel",end);
  /* ドラッグ直後／長押し直後の click を抑制（captureで先取り） */
  document.addEventListener("click",e=>{
    if(moved&&e.target.closest(".seedbar")){ e.stopPropagation(); e.preventDefault(); moved=false; }
    if(fired){ e.stopPropagation(); e.preventDefault(); fired=false; }
    if(hfired){ e.stopPropagation(); e.preventDefault(); hfired=false; }
  },true);
})();
 
/* ============ 成長ループ ============ */
function applyGrowth(dtSec,online){
  const now=Date.now();
  /* wet（雨/雪 or スプリンクラー）はマス単位で×2。ペット補正・全体ブーストは別枠で乗算 */
  const mBase=1+(hasPet("cat")?0.05:0)+(hasPet("dragon")?0.03:0);
  const gBoost=(online&&boostActive())?BOOST_MULT:1;
  let becameReady=0;
  for(let i=0;i<state.plotCount;i++){
    const p=state.plots[i];
    if(!p.seed||p.progress>=1) continue;
    const crop=cropOf(p.seed);
    const wetSec=plotWetSec(p,now,dtSec,online); /* wet分は×2＝実効秒に加算 */
    const m=mBase*gBoost;
    p.progress+=(dtSec+wetSec)/crop.time*m;
    if(p.progress>=1){
      /* 育ちきった実時刻に逆算して記録（オフライン中に育った場合も概算で） */
      const overSec=(p.progress-1)*crop.time/m;
      p.readyAt=now-Math.max(0,overSec)*1000;
      p.progress=1; becameReady++;
    }
  }
  return becameReady;
}
 
function tick(){
  const now=Date.now();
  const dt=(now-lastTick)/1000;
  lastTick=now;
  /* スリープ復帰などで巨大なdtが来たときは「オフライン精算」扱いにし、
     復帰した瞬間の天候倍率（雨×2・虹タイム×10）を全時間に遡って適用しない */
  const online=dt<=120;
  const ready=applyGrowth(dt,online);
  if(ready>0) beep(990,0.12);
  /* 変異判定は10秒に1回。溜めた経過秒ぶんまとめて抽選（1-exp(-rate*dt)は加法的なのでトータル確率は不変）。
     スリープ復帰など大きなdt（online=false）はオフライン精算として即時1回・アキュムレータはリセット */
  let muts=[];
  if(!online){
    muts=mutationTick(dt,false);
    mutAccum=0;
  }else{
    mutAccum+=dt;
    if(mutAccum>=MUT_INTERVAL){ muts=mutationTick(mutAccum,true); mutAccum=0; }
  }
  for(const m of muts) mutateFX(m.i,m.from,m.to,m.crop);
  /* いぬ：収穫可能になってから1分後に自動でカゴに収穫（モーダルなし） */
  if(hasPet("dog") && !state.dogOff){
    let autoN=0;
    for(let i=0;i<state.plotCount;i++){
      const p=state.plots[i];
      if(p.seed&&p.progress>=1&&p.readyAt&&now>p.readyAt+60*1000&&p.mut==="normal"){ /* 変異作物は自動収穫しない */
        const crop=cropOf(p.seed), c=[];
        if(tab==="garden"){ const el=document.querySelector(`.grid .plot[data-i="${i}"]`); if(el) flyEmoji(el,cropGlyph(crop)); }
        harvestPlot(i,c); autoN++;
        if(tab==="garden") patchPlot(i);
      }
    }
    if(autoN>0){ beep(620,0.1); } /* ヘッダ/トレイ更新はティック末尾でまとめて行う */
  }
  if(online) lightningTick();
  shopTick();
  checkFertUnlock(false);
  checkHomeCenterUnlock();
  petTick();
  renderHeader();
  weatherFX();
  todFX();
  if(tab==="garden"){
    barAccum+=dt; barAccumSlow+=dt;
    let doBarFast=false, doBarSlow=false;
    if(barAccum>=BAR_INTERVAL){ doBarFast=true; barAccum=0; }
    if(barAccumSlow>=BAR_INTERVAL_SLOW){ doBarSlow=true; barAccumSlow=0; }
    updateGardenLive(doBarFast,doBarSlow);
  }
  renderTray(false);
  const rs=document.getElementById("rsleft");
  if(rs){ const t=fmtMin(restockRemainSec()); if(rs.textContent!==t) rs.textContent=t; }
  /* 飾った作物がごくまれにブルっと震える */
  if(tab==="garden" && Math.random()<0.04){
    const ts=document.querySelectorAll(".trophy:not(.shiver)");
    if(ts.length){
      const el=ts[Math.floor(Math.random()*ts.length)];
      el.classList.add("shiver");
      setTimeout(()=>el.classList.remove("shiver"),520);
    }
  }
}
 
/* ============ 起動 ============ */
(function init(){
  let firstTime=false;
  try{ firstTime=!localStorage.getItem(SAVE_KEY); }catch(e){}
  state=load()||newState();
  fgEvent("fushigi_coin_snapshot",{coins:state.coins||0}); /* 案1：起動時の所持コインスナップショット */
  fgSetCoinsBucket();                                       /* 案2：資産帯を初期設定 */
  if(firstTime){ document.getElementById("title").classList.add("show"); }
  const away=(Date.now()-(state.lastSeen||Date.now()))/1000;
  if(away>5){
    /* カラス用：オフライン開始時点で成長中だったマスを記録（留守中に育ちきっても対象にする） */
    const crowGrew=new Set();
    for(let i=0;i<state.plotCount;i++){ const p=state.plots[i]; if(p.seed && p.progress<1) crowGrew.add(i); }
    const ready=applyGrowth(away,false);
    const muts=mutationTick(away,false);
    if(away>60 && ready>0){
      setTimeout(()=>toast(`🌙 おかえり！るすの間に ${ready} 個が育ったよ`,3500),400);
    }
    if(muts.length){
      const first=muts[0];
      const m=mutOf(first.to);
      setTimeout(()=>toast(`⚡ るすの間に ${first.crop.name}が${m.name}に変異してた！${muts.length>1?`（ほか${muts.length-1}件）`:""}`,4200),1000);
      if(muts.some(x=>x.to==="rainbow")){
        setTimeout(()=>showBanner("🌈 虹色変異！！","るすの間に虹色が生まれてた！","rainbow"),1400);
      }
    }
    /* カラス：留守30分以上・1日1回・成長中×未変異×肥料/湿りなしのマスから25%で1つ持ち去る */
    const crowVictim=crowOfflineCheck(away,crowGrew);
    if(crowVictim){
      const cc=crowVictim.crop;
      if(crowVictim.blocked){
        fgEvent("fushigi_crow",{result:"blocked",crop_id:cc.id});
        setTimeout(()=>{ /* カラスが空を横切って去る＋トースト */
          crowFlyFX(); beep(330,0.12); setTimeout(()=>beep(440,0.12),190);
          toast("🐦‍⬛💦 カカシがカラスを追いはらった！",4000,true);
        },1200);
      }else{
        fgEvent("fushigi_crow",{result:"stolen",crop_id:cc.id});
        setTimeout(()=>showCrowModal(cc,()=>{ /* 通知を閉じた後にカラスが空を横切る＋盗まれたマスの影 */
          crowFlyFX(); beep(330,0.12); setTimeout(()=>beep(280,0.14),190);
          crowStolenFX(crowVictim.idx,cc);
        }),1200);
      }
    }
  }
  if(state.shopPeriod!==curPeriod()){ state.shopPeriod=curPeriod(); state.shopBought={}; }
  const rareNow=RARE_IDS.filter(id=>shopStock(curPeriod())[id]!==undefined && stockLeft(id)>0).map(cropOf);
  if(rareNow.length){
    setTimeout(()=>toast(`🔥 いまショップに ${rareNow.map(c=>(c.e?c.e+" ":"")+c.name).join("、")} が入荷中！`,4000),1600);
  }
  lastTick=Date.now();
  todFX();
  weatherFX();
  render();
  if(!firstTime) checkLoginBonus(); /* 復帰プレイヤー：ログインボーナス（初回はタイトル開始後に表示） */
  fetchTokyoWeather();              /* 起動時に東京の天気を取得 */
  setInterval(fetchTokyoWeather,900000); /* 15分ごとに更新 */
  setInterval(tick,1000);
  setInterval(save,5000);
  /* BGM：最初のユーザー操作で再生開始（ブラウザの自動再生制限の解除も兼ねる） */
  ["pointerdown","touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,startBGM));
  /* 復帰処理（案A）：visibilitychangeだけでなく focus/pageshow でも実行する。
     ウィンドウを非フォーカスにしただけだとタブは「表示中」のままで visibilitychange が
     発火せず、長時間放置後に畑マスが再描画されない（背景が抜けて下の緑が見える）ため */
  let _lastResume=0;
  function onResume(){
    const now=Date.now();
    if(now-_lastResume<400) return; /* 同時多発イベントの二重実行を防ぐ */
    _lastResume=now;
    applyGrowth((now-lastTick)/1000,false);
    lastTick=now;
    render();
    repaintGarden(); /* 案B：GPUレイヤーが破棄された場合の描画抜け対策 */
  }
  window.addEventListener("visibilitychange",()=>{
    document.body.classList.toggle("app-hidden",document.hidden);
    bgmVisibility();
    if(document.hidden){ save(); }
    else onResume();
  });
  window.addEventListener("focus",onResume);
  window.addEventListener("pageshow",onResume);
  window.addEventListener("pagehide",save);
})();
</script>
