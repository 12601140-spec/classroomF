<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stack Ball Ultra 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #f0f0f0; font-family: 'Inter', sans-serif; user-select: none; touch-action: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .pointer-events-auto { pointer-events: auto; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .progress-bar-container { width: 200px; height: 10px; background: rgba(255,255,255,0.3); border-radius: 5px; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: #fff; transition: width 0.1s; }
        .fire-meter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 150px; height: 6px; background: rgba(0,0,0,0.2); border-radius: 3px; }
        #fire-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff9d00, #ff0000); border-radius: 3px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .animate-pulse-soft { animation: pulse 2s infinite ease-in-out; }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-layer" class="flex flex-col items-center justify-between py-10">
    <!-- 上部スコア・プログレス -->
    <div class="flex flex-col items-center gap-2">
        <div id="current-score" class="text-6-xl font-black text-white drop-shadow-lg text-6xl">0</div>
        <div class="flex items-center gap-4 bg-black/20 px-6 py-2 rounded-full backdrop-blur-md">
            <span id="level-current" class="text-white font-bold">1</span>
            <div class="progress-bar-container">
                <div id="progress-fill"></div>
            </div>
            <span id="level-next" class="text-white font-bold">2</span>
        </div>
    </div>

    <!-- コンボ/フィーバーメーター -->
    <div class="fire-meter">
        <div id="fire-fill"></div>
    </div>

    <!-- スタート画面 -->
    <div id="start-screen" class="pointer-events-auto absolute inset-0 flex flex-col items-center justify-center bg-black/40 backdrop-blur-sm transition-opacity duration-500">
        <h1 class="text-white text-7xl font-black italic mb-8 drop-shadow-2xl">STACK BALL</h1>
        <p class="text-white text-xl animate-bounce mb-10">タップしてスタート！</p>
        <div class="grid grid-cols-1 gap-4 text-white text-sm opacity-80 text-center">
            <p>● タップ（長押し）で粉砕！</p>
            <p>● 黒いブロックは避けて！</p>
            <p>● フィーバーモードは最強！</p>
        </div>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="game-over-screen" class="hidden pointer-events-auto absolute inset-0 flex flex-col items-center justify-center bg-red-600/80 backdrop-blur-md">
        <h2 class="text-white text-6xl font-black mb-4">FAILED!</h2>
        <p id="final-score" class="text-white text-2xl mb-8">Score: 0</p>
        <button onclick="game.reset()" class="bg-white text-red-600 px-10 py-4 rounded-full font-bold text-xl shadow-xl hover:scale-110 transition-transform active:scale-95">RETRY</button>
    </div>

    <!-- クリア画面 -->
    <div id="win-screen" class="hidden pointer-events-auto absolute inset-0 flex flex-col items-center justify-center bg-green-500/80 backdrop-blur-md">
        <h2 class="text-white text-6xl font-black mb-4">VICTORY!</h2>
        <p class="text-white text-2xl mb-8">レベルクリア！</p>
        <button onclick="game.nextLevel()" class="bg-white text-green-500 px-10 py-4 rounded-full font-bold text-xl shadow-xl hover:scale-110 transition-transform active:scale-95">NEXT LEVEL</button>
    </div>
</div>

<script>

const CONFIG = {
    BALL_RADIUS: 0.35,
    STACK_RADIUS: 2,
    STACK_HEIGHT: 0.5,
    STACK_GAP: 0.1,
    ROTATION_SPEED: 0.025,
    GRAVITY: -0.015,
    BOUNCE_VELOCITY: 0.22,
    SMASH_VELOCITY: -0.3,
    FIRE_MODE_THRESHOLD: 1.0, // 100%
    FIRE_MODE_DURATION: 3000, // 3秒
    MAX_STACKS_PER_LEVEL: 40,
    COLORS: [
        { main: 0x4CAF50, bg: 0xe8f5e9 }, // Green
        { main: 0x2196F3, bg: 0xe3f2fd }, // Blue
        { main: 0xFF9800, bg: 0xfff3e0 }, // Orange
        { main: 0xE91E63, bg: 0xfce4ec }, // Pink
        { main: 0x9C27B0, bg: 0xf3e5f5 }  // Purple
    ],
    BLACK_PIECE: 0x333333
};


class Game {
    constructor() {
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(this.renderer.domElement);

        this.level = 1;
        this.score = 0;
        this.isGameOver = false;
        this.isGameStarted = false;
        this.isWinning = false;
        this.isSmashing = false;
        this.isFireMode = false;
        this.fireCharge = 0;
        
        this.stacks = [];
        this.pieces = []; // 破壊された破片
        this.particles = [];

        this.initLights();
        this.initBall();
        this.initLevel();
        this.bindEvents();
        this.animate();
    }

    initLights() {
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        this.scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        this.scene.add(dirLight);

        // 背景色の設定
        this.updateColors();
    }

    updateColors() {
        const theme = CONFIG.COLORS[(this.level - 1) % CONFIG.COLORS.length];
        this.renderer.setClearColor(theme.bg);
        this.currentColor = theme.main;
    }

    initBall() {
        const geometry = new THREE.SphereGeometry(CONFIG.BALL_RADIUS, 32, 32);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            metalness: 0.1, 
            roughness: 0.1,
            emissive: 0x222222
        });
        this.ball = new THREE.Mesh(geometry, material);
        this.ball.castShadow = true;
        this.ball.receiveShadow = true;
        this.ball.position.set(0, 5, CONFIG.STACK_RADIUS - 0.2);
        this.scene.add(this.ball);

        this.ballVelocity = 0;
        
        // 軌跡エフェクト用のトレイル
        this.trail = [];
        this.maxTrail = 10;
        
        // 火炎エフェクト用のポイント
        const fireGeo = new THREE.BufferGeometry();
        const fireMat = new THREE.PointsMaterial({ color: 0xff4400, size: 0.1, transparent: true, opacity: 0.8 });
        this.firePoints = new THREE.Points(fireGeo, fireMat);
        this.firePoints.visible = false;
        this.scene.add(this.firePoints);
    }

    initLevel() {
        // 古いスタックを削除
        this.stacks.forEach(s => this.scene.remove(s.group));
        this.stacks = [];
        
        const stackCount = Math.min(20 + this.level * 2, CONFIG.MAX_STACKS_PER_LEVEL);
        this.totalStacks = stackCount;
        this.stacksRemaining = stackCount;

        // 柱（芯）
        if (this.cylinder) this.scene.remove(this.cylinder);
        const cylGeo = new THREE.CylinderGeometry(0.8, 0.8, (stackCount + 10) * (CONFIG.STACK_HEIGHT + CONFIG.STACK_GAP), 32);
        const cylMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
        this.cylinder = new THREE.Mesh(cylGeo, cylMat);
        this.cylinder.position.y = - (stackCount * (CONFIG.STACK_HEIGHT + CONFIG.STACK_GAP)) / 2 + 5;
        this.cylinder.receiveShadow = true;
        this.scene.add(this.cylinder);

        // 各階層のスタック作成
        for (let i = 0; i < stackCount; i++) {
            const group = new THREE.Group();
            group.position.y = 5 - i * (CONFIG.STACK_HEIGHT + CONFIG.STACK_GAP);
            
            // 回転のオフセットをランダムに
            group.rotation.y = Math.random() * Math.PI * 2;

            // 難易度調整: 黒いブロックの比率
            const blackRatio = Math.min(0.1 + (this.level * 0.02), 0.4);
            const segments = 12;
            
            for (let j = 0; j < segments; j++) {
                const isBlack = Math.random() < blackRatio;
                const mesh = this.createSegment(isBlack, j, segments);
                group.add(mesh);
            }

            this.scene.add(group);
            this.stacks.push({ group, broken: false });
        }

        // ゴール地点
        const finishGeo = new THREE.CylinderGeometry(CONFIG.STACK_RADIUS + 0.5, CONFIG.STACK_RADIUS + 0.5, 0.5, 32);
        const finishMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.5, roughness: 0.2 });
        this.finishDisk = new THREE.Mesh(finishGeo, finishMat);
        this.finishDisk.position.y = 5 - stackCount * (CONFIG.STACK_HEIGHT + CONFIG.STACK_GAP) - 1;
        this.scene.add(this.finishDisk);

        // カメラ初期位置
        this.camera.position.set(0, 10, 12);
        this.camera.lookAt(0, 5, 0);
        
        this.updateUI();
    }

    createSegment(isBlack, index, total) {
        const angleStep = (Math.PI * 2) / total;
        const innerRadius = 1.1;
        const outerRadius = CONFIG.STACK_RADIUS;
        
        const shape = new THREE.Shape();
        shape.absarc(0, 0, outerRadius, index * angleStep, (index + 1) * angleStep - 0.05, false);
        shape.absarc(0, 0, innerRadius, (index + 1) * angleStep - 0.05, index * angleStep, true);
        
        const extrudeSettings = { depth: CONFIG.STACK_HEIGHT, bevelEnabled: false };
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geometry.rotateX(Math.PI / 2);

        const material = new THREE.MeshStandardMaterial({
            color: isBlack ? CONFIG.BLACK_PIECE : this.currentColor,
            roughness: 0.3,
            metalness: 0.2
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.userData.isBlack = isBlack;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
    }

    bindEvents() {
        const handleStart = (e) => {
            if (!this.isGameStarted && !this.isGameOver && !this.isWinning) {
                this.isGameStarted = true;
                gsap.to(document.getElementById('start-screen'), { opacity: 0, duration: 0.3, onComplete: () => {
                    document.getElementById('start-screen').classList.add('hidden');
                }});
            }
            if (this.isGameStarted && !this.isGameOver) {
                this.isSmashing = true;
            }
        };

        const handleEnd = (e) => {
            this.isSmashing = false;
        };

        window.addEventListener('mousedown', handleStart);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(); }, { passive: false });
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    animate() {
        requestAnimationFrame(() => this.animate());

        if (this.isGameOver || this.isWinning) {
            this.renderer.render(this.scene, this.camera);
            return;
        }

        if (this.isGameStarted) {
            this.updatePhysics();
            this.updateStacks();
            this.updateCamera();
            this.updateParticles();
            this.updateFireMode();
        }

        this.renderer.render(this.scene, this.camera);
    }

    updatePhysics() {
        if (this.isSmashing) {
            this.ballVelocity = CONFIG.SMASH_VELOCITY;
            this.ball.position.y += this.ballVelocity;
            
            // 現在のスタックとの衝突確認
            const currentStackIdx = Math.floor((5.1 - (this.ball.position.y + CONFIG.BALL_RADIUS)) / (CONFIG.STACK_HEIGHT + CONFIG.STACK_GAP));
            
            if (currentStackIdx >= 0 && currentStackIdx < this.stacks.length) {
                const stack = this.stacks[currentStackIdx];
                if (!stack.broken) {
                    this.checkCollision(stack, currentStackIdx);
                }
            }
        } else {
            // 跳ね返り処理
            this.ballVelocity += CONFIG.GRAVITY;
            this.ball.position.y += this.ballVelocity;

            const currentStackIdx = Math.floor((5 - (this.ball.position.y - CONFIG.BALL_RADIUS)) / (CONFIG.STACK_HEIGHT + CONFIG.STACK_GAP));
            
            if (currentStackIdx >= 0 && currentStackIdx < this.stacks.length) {
                const stack = this.stacks[currentStackIdx];
                const stackTopY = 5 - currentStackIdx * (CONFIG.STACK_HEIGHT + CONFIG.STACK_GAP);
                
                if (!stack.broken && this.ball.position.y - CONFIG.BALL_RADIUS <= stackTopY) {
                    this.ball.position.y = stackTopY + CONFIG.BALL_RADIUS;
                    this.ballVelocity = CONFIG.BOUNCE_VELOCITY;
                    this.createBounceEffect();
                }
            }
        }

        // ゴール判定
        if (this.ball.position.y <= this.finishDisk.position.y + CONFIG.BALL_RADIUS + 0.5) {
            this.win();
        }
    }

    checkCollision(stack, index) {
        // ボールの角度をスタックの回転に合わせて正規化
        let angle = (stack.group.rotation.y % (Math.PI * 2) + (Math.PI * 2)) % (Math.PI * 2);
        // ボールは常に正面(z軸プラス方向)にあると仮定。スタックが回っているので相対的なセグメントを特定
        // 実際の実装では、ボール直下のメッシュを直接検知するのが正確
        const raycaster = new THREE.Raycaster(
            new THREE.Vector3(this.ball.position.x, this.ball.position.y + 1, this.ball.position.z),
            new THREE.Vector3(0, -1, 0)
        );
        const intersects = raycaster.intersectObjects(stack.group.children);

        if (intersects.length > 0) {
            const hit = intersects[0].object;
            if (hit.userData.isBlack && !this.isFireMode) {
                this.gameOver();
            } else {
                this.breakStack(stack, index);
            }
        }
    }

    breakStack(stack, index) {
        stack.broken = true;
        this.stacksRemaining--;
        this.score += 10;
        this.fireCharge = Math.min(this.fireCharge + 0.05, 1.2); // 少し多めにチャージ

        // 破片を飛ばす
        const children = [...stack.group.children];
        children.forEach((piece, i) => {
            stack.group.remove(piece);
            this.scene.add(piece);
            piece.position.add(stack.group.position);
            
            // 物理シミュレーション用データ
            const dir = new THREE.Vector3(
                (Math.random() - 0.5) * 5,
                Math.random() * 5 + 2,
                (Math.random() - 0.5) * 5
            );
            this.pieces.push({
                mesh: piece,
                velocity: dir,
                rotation: new THREE.Vector3(Math.random() * 0.2, Math.random() * 0.2, Math.random() * 0.2),
                life: 1.0
            });
        });

        this.updateUI();
        
        // 衝撃波
        this.createShockwave(stack.group.position.y);
    }

    updateStacks() {
        this.stacks.forEach((s, i) => {
            if (!s.broken) {
                s.group.rotation.y += CONFIG.ROTATION_SPEED * (i % 2 === 0 ? 1 : -1);
            }
        });
    }

    updateCamera() {
        const targetY = this.ball.position.y + 5;
        this.camera.position.y += (targetY - this.camera.position.y) * 0.1;
        this.camera.lookAt(0, this.ball.position.y - 2, 0);
    }

    updateParticles() {
        // 破片の更新
        for (let i = this.pieces.length - 1; i >= 0; i--) {
            const p = this.pieces[i];
            p.mesh.position.add(p.velocity.multiplyScalar(0.05));
            p.mesh.rotation.x += p.rotation.x;
            p.mesh.rotation.y += p.rotation.y;
            p.velocity.y -= 0.5; // 重力
            p.life -= 0.02;
            p.mesh.material.opacity = p.life;
            p.mesh.material.transparent = true;

            if (p.life <= 0) {
                this.scene.remove(p.mesh);
                this.pieces.splice(i, 1);
            }
        }

        // パーティクルの更新
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const part = this.particles[i];
            part.mesh.position.add(part.velocity);
            part.life -= 0.05;
            part.mesh.scale.multiplyScalar(0.95);
            if (part.life <= 0) {
                this.scene.remove(part.mesh);
                this.particles.splice(i, 1);
            }
        }
    }

    updateFireMode() {
        if (!this.isSmashing) {
            this.fireCharge = Math.max(0, this.fireCharge - 0.01);
        }

        if (this.fireCharge >= 1.0 && !this.isFireMode) {
            this.isFireMode = true;
            this.ball.material.emissive.setHex(0xff0000);
            this.firePoints.visible = true;
            
            setTimeout(() => {
                this.isFireMode = false;
                this.fireCharge = 0;
                this.ball.material.emissive.setHex(0x222222);
                this.firePoints.visible = false;
            }, CONFIG.FIRE_MODE_DURATION);
        }

        // フィーバー時の視覚効果
        if (this.isFireMode) {
            this.ball.scale.set(1.2, 1.2, 1.2);
            // パーティクル生成
            this.createFireParticle();
        } else {
            this.ball.scale.set(1, 1, 1);
        }

        document.getElementById('fire-fill').style.width = `${Math.min(this.fireCharge * 100, 100)}%`;
    }

    createBounceEffect() {
        const geo = new THREE.RingGeometry(0.1, 0.4, 32);
        const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(geo, mat);
        ring.position.set(this.ball.position.x, this.ball.position.y - CONFIG.BALL_RADIUS, this.ball.position.z);
        ring.rotation.x = Math.PI / 2;
        this.scene.add(ring);
        
        gsap.to(ring.scale, { x: 3, y: 3, duration: 0.4 });
        gsap.to(mat, { opacity: 0, duration: 0.4, onComplete: () => this.scene.remove(ring) });
    }

    createShockwave(y) {
        const geo = new THREE.TorusGeometry(CONFIG.STACK_RADIUS, 0.05, 16, 100);
        const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
        const wave = new THREE.Mesh(geo, mat);
        wave.position.y = y;
        wave.rotation.x = Math.PI / 2;
        this.scene.add(wave);

        gsap.to(wave.scale, { x: 1.5, y: 1.5, z: 1.5, duration: 0.3 });
        gsap.to(mat, { opacity: 0, duration: 0.3, onComplete: () => this.scene.remove(wave) });
    }

    createFireParticle() {
        const geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
        const mat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const p = new THREE.Mesh(geo, mat);
        p.position.copy(this.ball.position);
        this.scene.add(p);
        this.particles.push({
            mesh: p,
            velocity: new THREE.Vector3((Math.random()-0.5)*0.2, Math.random()*0.2, (Math.random()-0.5)*0.2),
            life: 1.0
        });
    }

    updateUI() {
        document.getElementById('current-score').innerText = this.score;
        document.getElementById('level-current').innerText = this.level;
        document.getElementById('level-next').innerText = this.level + 1;
        
        const progress = ((this.totalStacks - this.stacksRemaining) / this.totalStacks) * 100;
        document.getElementById('progress-fill').style.width = `${progress}%`;
    }

    gameOver() {
        this.isGameOver = true;
        this.isSmashing = false;
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `Score: ${this.score}`;
        
        // 爆発エフェクト
        for(let i=0; i<20; i++) {
            this.createFireParticle();
        }
    }

    win() {
        if (this.isWinning) return;
        this.isWinning = true;
        this.isSmashing = false;
        document.getElementById('win-screen').classList.remove('hidden');
    }

    nextLevel() {
        this.level++;
        this.isWinning = false;
        this.isGameStarted = false;
        this.fireCharge = 0;
        document.getElementById('win-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('start-screen').style.opacity = '1';
        
        this.updateColors();
        this.initLevel();
        this.ball.position.set(0, 5, CONFIG.STACK_RADIUS - 0.2);
        this.ballVelocity = 0;
    }

    reset() {
        this.level = 1;
        this.score = 0;
        this.isGameOver = false;
        this.isGameStarted = false;
        this.fireCharge = 0;
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('start-screen').style.opacity = '1';
        
        this.updateColors();
        this.initLevel();
        this.ball.position.set(0, 5, CONFIG.STACK_RADIUS - 0.2);
        this.ballVelocity = 0;
    }
}

window.onload = () => {
    window.game = new Game();
};

</script>
</body>
</html>
